    log('session.captures',(M.captures||[]).length,'primary='+M.primary,'· com .wav:',(M.captures||[]).filter(c=>c.wav).length);}
  return {on,mark,log,dumpPayload,dumpSession};
})();

function normalizeMetrics(a){const byId={},sc={},cv={};let low=0,na=0;
  (a&&a.metrics||[]).forEach(m=>{byId[m.id]=m;
    (m.scalars||[]).forEach(s=>{sc[s.key]=s;if(s.quality==='LowConfidence')low++;if(s.quality==='NotApplicable'||s.valuePresent===false)na++;});
    (m.curves||[]).forEach(c=>{if(!cv[m.id])cv[m.id]=c;});});
  PDBG.log('normalizeMetrics · ids',Object.keys(byId),'· lowConf',low,'· na',na);
  return {byId,scalars:sc,curves:cv,lowConf:low,na};}
/* Observação espectral oficial — equivalente ao fullSpectrum do AnalysisEngine (Subetapa C).
   Função CIENTÍFICA PURA. Responde apenas: "qual é a representação espectral oficial deste bloco?".
   Entrada EXCLUSIVA: um BLOCO de amostras + sample rate. Saída: a representação espectral oficial do
   bloco = potência |X|² por bin em [0,nfft/2) + nfft (para o mapeamento bin↔frequência feito pela
   família). Método oficial: janela Blackman-Harris 4 de comprimento = bloco; zero-pad até npow2; FFT.
   NÃO conhece Session, captura, ST-03, Evidence, LabEngine, contrato metrics, nem THD/THD+N/IMD/
   fundamental/banda/harmônicos/±4/fórmulas/unidades. Reutiliza SOMENTE SCI.fft. Contém apenas o
   conhecimento COMUM a todos os consumidores (MS-05, MS-06 e, naturalmente, MS-07). O ganho coerente
   é omitido por cancelar na razão (regra de cancelamento) — mantém a aritmética idêntica às famílias. */
function officialSpectrum(block, fs){
  void fs;                                                 // fs é o contexto de amostragem da observação (mapeamento bin↔freq é da família)
  const L=block.length; let nfft=1; while(nfft<L) nfft<<=1;// janela = bloco; zero-pad -> npow2
  const c0=0.35875,c1=0.48829,c2=0.14128,c3=0.01168;       // Blackman-Harris 4 termos
  const re=new Array(nfft).fill(0), im=new Array(nfft).fill(0);
  for(let i=0;i<L;i++){const r=i/(L-1);
    const w=c0-c1*Math.cos(2*Math.PI*r)+c2*Math.cos(4*Math.PI*r)-c3*Math.cos(6*Math.PI*r);
    re[i]=block[i]*w;}
  SCI.fft(re,im);
  const half=nfft>>1, pow=new Array(half);
  for(let k=0;k<half;k++)pow[k]=re[k]*re[k]+im[k]*im[k];    // |X|² (potência; cg omitido — cancela na razão)
  return {pow, nfft};
}
/* MS-05 (THD) — PRIMEIRA família científica NATIVA. Método oficial (via officialSpectrum): THD sobre
   harmônicos 2..10 relativo ao fundamental fixo de 1 kHz, integrando energia ±4 bins. Função PURA e
   agnóstica da origem { samples, sampleRate }; sem estado/cache; SEM limiar interno. A SELEÇÃO/recorte
   do bloco de 1 kHz e todo o conhecimento (fundamental, harmônicos, ±4, fórmula, dB) permanecem NA
   FAMÍLIA; apenas a preparação espectral é a observação compartilhada. */
function computeMS05(signal){
  const samples=signal.samples, fs=signal.sampleRate;
  const seg=Math.round(2*fs), a=seg, b=Math.min(2*seg, samples.length);   // recorte do bloco de 1 kHz (FAMÍLIA)
  if(a>=b) return {thd_pct:0, thd_db:20*Math.log10(1e-12)};
  const {pow, nfft}=officialSpectrum(samples.slice(a,b), fs);             // observação espectral oficial
  const half=pow.length;
  const energyNear=f=>{const c=Math.round(f*nfft/fs);let e=0;
    for(let k=c-4;k<=c+4;k++)if(k>=0&&k<half)e+=pow[k];return e;};        // integração ±4 (conhecimento da família)
  const A1=energyNear(1000);
  if(A1<=0) return {thd_pct:0, thd_db:20*Math.log10(1e-12)};
  let harm=0;for(let n=2;n<=10;n++){const fh=n*1000;if(fh>=fs/2)break;harm+=energyNear(fh);}
  const thd_pct=100*Math.sqrt(harm)/Math.sqrt(A1);
  const thd_db=20*Math.log10(Math.max(thd_pct/100,1e-12));
  return {thd_pct, thd_db};
}
/* MS-06 (THD+N) — SEGUNDA família nativa. Método oficial (via officialSpectrum): energia TOTAL na banda
   [20,20000] Hz menos o fundamental (±4 bins) = residual; THD+N = 100·√(rest)/√(A1). PURA, agnóstica,
   sem estado, sem limiar. A seleção do bloco e todo o conhecimento (banda, fundamental, ±4, fórmula, dB)
   permanecem NA FAMÍLIA; apenas a preparação espectral é a observação compartilhada. */
function computeMS06(signal){
  const samples=signal.samples, fs=signal.sampleRate;
  const seg=Math.round(2*fs), a=seg, b=Math.min(2*seg, samples.length);   // recorte do bloco de 1 kHz (FAMÍLIA)
  if(a>=b) return {thdn_pct:0, thdn_db:20*Math.log10(1e-12)};
  const {pow, nfft}=officialSpectrum(samples.slice(a,b), fs);             // observação espectral oficial
  const half=pow.length, fb=Math.round(1000*nfft/fs), BAND_LO=20, BAND_HI=20000;
  let Et=0,A1=0;                                           // energia total na banda e do fundamental ±4
  for(let k=0;k<half;k++){const f=k*fs/nfft; if(f<BAND_LO||f>BAND_HI)continue;
    Et+=pow[k]; if(Math.abs(k-fb)<=4)A1+=pow[k];}
  const rest=Math.max(0,Et-A1);
  const thdn_pct=A1>0 ? 100*Math.sqrt(rest)/Math.sqrt(A1) : 0;
  const thdn_db=20*Math.log10(Math.max(thdn_pct/100,1e-12));
  return {thdn_pct, thdn_db};
}
/* MS-07 (IMD) — TERCEIRA família nativa. Método oficial (via officialSpectrum): observação espectral
   sobre a CAPTURA MULTITOM INTEIRA (ST-02); energia dos produtos de intermodulação (fi+fj, |fi-fj|,
   2fi+fj, |2fi-fj|) dentro da banda [20,20000] Hz, integrando ±4 bins, EXCLUINDO produtos que coincidem
   com qualquer fundamental (regra CR-IMD); IMD = 100·√(imdE)/√(toneE). PURA, agnóstica { samples,
   sampleRate }, sem estado, sem limiar. Todo o conhecimento específico da IMD (multitom, ±4, produtos,
   CR-IMD, fórmula, dB) permanece NA FAMÍLIA; apenas a preparação espectral é a observação compartilhada.
   O bloco é a captura inteira — não há recorte, ao contrário de MS-05/MS-06. */
function computeMS07(signal){
  const samples=signal.samples, fs=signal.sampleRate;
  if(!samples||samples.length===0) return {imd_pct:0, imd_db:20*Math.log10(1e-12)};
  const {pow, nfft}=officialSpectrum(samples, fs);        // observação espectral oficial (captura multitom inteira)
  const half=pow.length;
  const TONES=[55,110,220,440,1320,3960,7920,15840];      // multitom oficial (conhecimento da família)
  const BAND_LO=20, BAND_HI=20000;
  const binOf=f=>Math.round(f*nfft/fs);
  const enAt=f=>{const c=binOf(f);let e=0;
    for(let k=c-4;k<=c+4;k++)if(k>=0&&k<half)e+=pow[k];return e;};   // integração ±4 (conhecimento da família)
  const toneBin=TONES.map(binOf);
  const coincides=cb=>{for(let i=0;i<toneBin.length;i++)if(Math.abs(cb-toneBin[i])<=4)return true;return false;};
  let toneE=0;for(const f of TONES)toneE+=enAt(f);
  let imdE=0;
  for(let i=0;i<TONES.length;i++)for(let j=0;j<TONES.length;j++){
    if(i===j)continue;
    const fi=TONES[i],fj=TONES[j];
    const prods=[fi+fj,Math.abs(fi-fj),2*fi+fj,Math.abs(2*fi-fj)];   // produtos de intermodulação
    for(const p of prods){
      if(p<BAND_LO||p>BAND_HI)continue;
      if(coincides(binOf(p)))continue;   // CR-IMD: produto coincide com fundamental -> não soma
      imdE+=enAt(p);
    }
  }
  const imd_pct=toneE>0 ? 100*Math.sqrt(imdE)/Math.sqrt(toneE) : 0;
  const imd_db=20*Math.log10(Math.max(imd_pct/100,1e-12));
  return {imd_pct, imd_db};
}
/* MS-08 (Piso de Ruído) — QUARTA família nativa e PRIMEIRA de uma CLASSE OBSERVACIONAL NOVA (Welch/PSD).
   Método oficial (caminho ativo USE_FULL_OBSERVATION do AnalysisEngine::noiseFloor): periodograma de Welch
   sobre a captura de SILÊNCIO (ST-09) — janela Hann N=4096, hop=2048 (50% overlap), potência |X|² por bin
   normalizada por ganho coerente (|X|/cg·2), MÉDIA sobre TODOS os quadros, integração na banda [20,20000] Hz
   e conversão para dBFS ABSOLUTO. PURA, agnóstica { samples, sampleRate }, sem estado.
   OBSERVAÇÃO PRIVADA (D-PRIMEIRO-CONSUMIDOR): NÃO consome officialSpectrum — método científico distinto
   (Welch/Hann/média vs single-shot/BH4). Diferente das razões MS-05/06/07, cg e o fator ×2 NÃO cancelam
   (medida absoluta), por isso permanecem NA FAMÍLIA. Reutiliza SOMENTE SCI.fft; nenhuma abstração nova.
   D-SAÍDA-OFICIAL: calcula apenas o escalar oficial (NoiseFloor_dBFS) — não reproduz a Curve "Noise Floor"
   nem os diagnósticos do Core (sem consumidor); a integração de banda é acumulada por quadro (sem array
   por-bin intermediário). */
function computeMS08(signal){
  const samples=signal.samples, fs=signal.sampleRate;
  const N=4096, hop=N>>1, half=N>>1, BAND_LO=20, BAND_HI=20000;
  const win=new Array(N); let cg=0;                        // janela Hann + ganho coerente (privados à família)
  for(let i=0;i<N;i++){const w=0.5-0.5*Math.cos(2*Math.PI*i/(N-1)); win[i]=w; cg+=w;}
  const re=new Array(N), im=new Array(N);
  let acc=0, frames=0;                                     // Σ_quadros (Σ_bins-na-banda mag²) ; nº de quadros
  for(let start=0; start+N<=samples.length; start+=hop){
    for(let i=0;i<N;i++){re[i]=samples[start+i]*win[i]; im[i]=0;}
    SCI.fft(re,im);
    let band=0;
    for(let b=0;b<half;b++){const f=b*fs/N; if(f<BAND_LO||f>BAND_HI)continue;
      const mag=Math.hypot(re[b],im[b])/cg*2;              // magnitude normalizada (método espectral do Core)
      band+=mag*mag;}                                      // PSD por bin, integrada na banda
    acc+=band; frames++;
  }
  const integFull=frames>0 ? acc/frames : 0;              // média Welch sobre todos os quadros
  const noisefloor_dbfs=10*Math.log10(Math.max(integFull,1e-30));
  return {noisefloor_dbfs};
}
/* MS-09 (Dynamic Range) — QUINTA família nativa. Primeira com DEPENDÊNCIA CIENTÍFICA entre famílias.
   Método oficial (AnalysisEngine::dynamicRange): sobre a captura de degraus dinâmicos (ST-08), divide em
   8 segmentos de 100 ms, calcula o RMS de cada um, DESCARTA os segmentos clipados (pico ≥ 1.0), seleciona
   o MAIOR RMS válido, converte para dB e SUBTRAI o piso de ruído oficial da MS-08:
       DynamicRange_dB = 20·log10(maiorRMSválido) − NoiseFloor_dBFS.
   PURA, agnóstica. RMS/pico/segmentação são PRIMITIVAS aritméticas privadas da família (não abstração).
   D-DEPENDÊNCIA-DE-FAMÍLIA: a segunda entrada é o RESULTADO CIENTÍFICO OFICIAL da MS-08 (objeto), não o
   contrato/UI — a família não conhece apresentação. Reproduz internamente a semântica do Core
   (Normal/NotApplicable/Error); a tradução para o contrato é feita pelo LabEngine. */
function computeMS09(signal, officialNoiseFloor){
  const samples=signal.samples, fs=signal.sampleRate;
  const nf = officialNoiseFloor && officialNoiseFloor.noisefloor_dbfs;   // dependência: resultado oficial da MS-08
  if(!samples || !samples.length || nf==null || !isFinite(nf))
    return {quality:'Error', dynamicrange_db:null};                      // pré-condição científica ausente
  const seg=Math.round(0.100*fs);
  let lmaxRms=0;
  for(let s=0;s<8;s++){
    const a=s*seg; if(a>=samples.length) continue;                       // segmento vazio -> ignora (slice do Core)
    const part=samples.slice(a, Math.min((s+1)*seg, samples.length));
    if(part.length===0) continue;
    let sq=0, pk=0;
    for(let i=0;i<part.length;i++){const v=part[i]; sq+=v*v; const av=Math.abs(v); if(av>pk)pk=av;}
    const rms=Math.sqrt(sq/part.length);                                 // RMS do segmento (primitiva aritmética)
    if(pk<1.0 && rms>lmaxRms) lmaxRms=rms;                               // gate de clipping: descarta pico ≥ 1.0
  }
  if(lmaxRms<=0) return {quality:'NotApplicable', dynamicrange_db:null}; // todos os degraus clipados/vazios
  const lmaxDb=20*Math.log10(lmaxRms);
  return {quality:'Normal', dynamicrange_db: lmaxDb - nf};               // maior RMS válido − piso oficial da MS-08
}
/* MS-10 (SNR) — SEXTA família nativa, terceira do grupo de ruído. Método oficial (AnalysisEngine::snr):
   razão de potências RMS temporais entre o tom de 1 kHz (ST-03) e o ruído (ST-09):
       SNR_dB = 10·log10(ps/pn),  ps = meanSquare(tom),  pn = meanSquare(ruído).
   PURA, agnóstica. Recebe DUAS CAPTURAS oficiais (D-ENTRADAS-CIENTÍFICAS): ST-03 (tom) e ST-09 (ruído) —
   ambas entradas científicas EXPLÍCITAS na assinatura; NÃO há dependência de resultado de outra família
   (o ruído aqui é RMS temporal de banda LARGA, não o piso PSD Welch da MS-08). Mesma classe observacional
   temporal da MS-09; RMS é primitiva aritmética privada (D-PRIMITIVA-ARITMÉTICA) — inline, sem promoção. */
function computeMS10(signal, noiseSignal){
  const fs=signal.sampleRate, seg=Math.round(2.0*fs);
  // Recorte [2 s, 4 s): região ESTACIONÁRIA do estímulo oficial (mesma convenção do Core e de MS-05/06).
  // NÃO é otimização — é a definição científica do trecho analisável do ST-03.
  const tone=signal.samples.slice(seg, 2*seg);
  const ms=x=>{if(!x.length)return 0; let s=0; for(let i=0;i<x.length;i++)s+=x[i]*x[i]; return s/x.length;};
  const ps=ms(tone), pn=ms(noiseSignal.samples);   // potências RMS temporais (aritmética inline privada)
  // REGRA CIENTÍFICA da métrica (NÃO tratamento de erro): ruído nulo satura o SNR em 200 dB. Produz
  // normalmente o escalar oficial 200.0 — não altera quality nem valuePresent.
  if(pn<=0) return {snr_db:200};
  return {snr_db:10*Math.log10(ps/pn)};            // fórmula oficial, sem proteção adicional (ps==0 -> -Infinity, idêntico ao Core)
}
/* MS-12 (Latency) — SÉTIMA família nativa. Método oficial (AnalysisEngine::latency): round-trip = posição
   do PICO do impulso capturado (ST-06, cru) menos a posição do impulso EMITIDO. PURA, agnóstica.
   Uma única captura (ST-06, canal principal); SEM dependência de família.
   D-ESTÍMULO-DE-REFERÊNCIA: a posição do impulso emitido é reproduzida pela MESMA regra determinística do
   Core — impulsePositionSamples(fs) = round(0.5·fs) — nunca inferida da captura.
   D-CONDIÇÃO-CIENTÍFICA: o clamp max(0,·) (latência não-negativa) é parte do método, não tratamento de erro.
   ST-06 é consumido CRU (o CaptureEngine o exclui do sync-alignment), preservando o pico/latência.
   D-ESCALAR-OFICIAL: publica AMBOS os escalares oficiais do Core (Latency_samples e Latency_ms), mesmo que
   a UI atual só exiba Latency_ms — paridade com o contrato científico do Core.
   peak (max|x|, primeira ocorrência) é primitiva aritmética privada (D-PRIMITIVA-ARITMÉTICA), inline. */
function computeMS12(signal){
  const samples=signal.samples, fs=signal.sampleRate;
  let pk=0, pv=0;                                  // primeira ocorrência do pico |x| máx (como no Core)
  for(let i=0;i<samples.length;i++){const a=Math.abs(samples[i]); if(a>pv){pv=a; pk=i;}}
  const emitted=Math.round(0.5*fs);               // posição do impulso EMITIDO (regra determinística do Core)
  const rt=Math.max(0, pk-emitted);               // round-trip; clamp científico de não-negatividade
  return {latency_samples: rt, latency_ms: rt/fs*1000};
}
/* --- Observações/operações científicas COMPARTILHADAS (promovidas na Subetapa C) ---
   officialEnvelope e bestLag reproduzem extractEnvelope/bestLag do AnalysisEngine. A auditoria demonstrou
   que a MS-14 (próxima família) é um segundo consumidor com MÉTODO IDÊNTICO (D-PROMOÇÃO-POR-MÉTODO) e
   interface pura e mínima (D-PUREZA-DA-ABSTRAÇÃO); autorizada a promoção de privados-da-MS-13 a
   COMPARTILHADOS, SEM alterar nenhuma operação matemática nem assinatura (D-ABSTRAÇÃO-INVARIANTE).
   Consumidores: MS-13 (MS-14 na próxima etapa).
   officialEnvelope — observação de envoltória OFICIAL (Hilbert + suavização de 1 ms), paralela ao
   officialSpectrum. Depende apenas de {samples, sampleRate}. A IFFT permanece DERIVADA da FFT (SCI.fft)
   por conjugação, ENCAPSULADA aqui: NÃO existe SCI.ifft (D-INFRAESTRUTURA-DERIVADA).
   bestLag — alinhamento por correlação cruzada (lag≥0). O limite maxLag pertence às FAMÍLIAS consumidoras
   (política de latência de 50 ms), apenas RECEBIDO aqui. */
function officialEnvelope(samples, fs){
  const L=samples.length; if(L===0) return [];
  let N=1; while(N<L) N<<=1; if(N<256) N=256;                    // nextPow2 com piso FFT_MIN
  const re=new Array(N).fill(0), im=new Array(N).fill(0);
  for(let i=0;i<L;i++) re[i]=samples[i];
  SCI.fft(re,im);                                                // FFT direta
  const half=N>>1;
  for(let i=0;i<N;i++){const h=(i===0||i===half)?1:(i<half?2:0); re[i]*=h; im[i]*=h;}   // filtro analítico
  for(let i=0;i<N;i++) im[i]=-im[i];                             // IFFT por conjugação: |IFFT(X)| = |FFT(conj(X))|/N
  SCI.fft(re,im);
  const mag=new Array(L);
  for(let i=0;i<L;i++) mag[i]=Math.hypot(re[i],im[i])/N;        // magnitude analítica de Hilbert
  let w=Math.round(0.001*fs); if(w<1) w=1;                       // média móvel de 1 ms (box, causal-centrada)
  const prefix=new Array(L+1); prefix[0]=0;
  for(let i=0;i<L;i++) prefix[i+1]=prefix[i]+mag[i];
  const hw=w>>1, out=new Array(L);
  for(let i=0;i<L;i++){let lo=i-hw, hi=i-hw+w; if(lo<0)lo=0; if(hi>L)hi=L; out[i]=(prefix[hi]-prefix[lo])/(hi-lo);}
  return out;
}
function bestLag(inEnv, outEnv, maxLag){
  if(!inEnv.length || !outEnv.length) return 0;
  let best=0, bestC=-1e300;
  for(let lag=0; lag<=maxLag; lag++){
    if(lag>=outEnv.length) break;
    const W=Math.min(inEnv.length, outEnv.length-lag);
    let c=0; for(let i=0;i<W;i++) c+=inEnv[i]*outEnv[i+lag];
    if(c>bestC){bestC=c; best=lag;}
  }
  return best;
}
/* MS-13 (Dynamic Behaviour) — PRIMEIRA família COMPOSTA. Método oficial (AnalysisEngine::dynamicBehaviour):
   quatro sub-métodos científicos independentes sobre estímulos distintos —
     settling (ST-07, obrigatório), consistency (ST-12), drift (ST-13), level transfer (ST-08 + fonte emitida).
   PURA, agnóstica. Entradas EXPLÍCITAS (D-ENTRADAS-CIENTÍFICAS): objeto nomeado {burst,train,sust,step,stepSource}.
   A fonte emitida do ST-08 vem do Evidence Package (session.stimuli), NUNCA regenerada (D-INGESTÃO-≠-CONTRATO).
   Todas as condições científicas (limiar 5% do settling; guarda mean>0; pisos 1e-12; alinhamento por bestLag)
   pertencem ao método (D-CONDIÇÃO-CIENTÍFICA). Publica TODOS os escalares oficiais (D-ESCALAR-OFICIAL). */
function computeMS13(inputs){
  const burst=inputs.burst;
  if(!burst||!burst.samples||!burst.samples.length) return {quality:'Error'};   // ST-07 obrigatório
  const fs=burst.sampleRate, out={quality:'Normal'};
  const ms=x=>{if(!x.length)return 0; let s=0; for(let i=0;i<x.length;i++)s+=x[i]*x[i]; return s/x.length;};
  // --- Settling (ST-07): tempo até a envoltória entrar na banda de 5% do valor final ---
  {
    const env=officialEnvelope(burst.samples, fs);
    const burstN=Math.round(0.100*fs);
    let finalVal=0, cnt=0;
    for(let i=Math.floor(burstN*7/10); i<burstN && i<env.length; i++){ finalVal+=env[i]; cnt++; }
    if(cnt>0) finalVal/=cnt;
    let settleIdx=0;
    for(let i=0; i<burstN && i<env.length; i++)
      if(finalVal>0 && Math.abs(env[i]-finalVal)<=0.05*finalVal){ settleIdx=i; break; }   // limiar de 5%
    out.settlingTime_ms=settleIdx/fs*1000;
  }
  // --- Consistency (ST-12): coeficiente de variação dos picos de 10 períodos de 100 ms ---
  if(inputs.train&&inputs.train.samples&&inputs.train.samples.length){
    const te=officialEnvelope(inputs.train.samples, fs), period=Math.round(0.100*fs), peaks=[];
    for(let p=0;p<10;p++){let mx=0; for(let i=p*period;i<(p+1)*period && i<te.length;i++) if(te[i]>mx)mx=te[i]; peaks.push(mx);}
    let mean=0; for(const v of peaks) mean+=v; mean/=peaks.length;
    let varr=0; for(const v of peaks) varr+=(v-mean)*(v-mean); varr/=peaks.length;
    out.repetitionConsistency_pct = mean>0 ? 100*Math.sqrt(varr)/mean : 0;   // guarda mean>0
  }
  // --- Drift (ST-13): variação de nível entre a janela de 1 s e a de 29 s ---
  if(inputs.sust&&inputs.sust.samples&&inputs.sust.samples.length){
    const se=officialEnvelope(inputs.sust.samples, fs), oneSec=Math.round(fs);
    const avgAt=sec=>{let s=0,c=0; for(let i=sec*oneSec;i<sec*oneSec+oneSec && i<se.length;i++){s+=se[i];c++;} return c?s/c:0;};
    const e1=avgAt(1), e30=avgAt(29);
    out.drift_dB=20*Math.log10(Math.max(e30,1e-12)/Math.max(e1,1e-12));   // pisos 1e-12
  }
  // --- Level Transfer (ST-08 + fonte emitida): ganho RMS out/in por degrau (8 x 100 ms) + erro máx ---
  if(inputs.step&&inputs.step.samples&&inputs.step.samples.length&&inputs.stepSource&&inputs.stepSource.samples&&inputs.stepSource.samples.length){
    const inn=inputs.stepSource.samples, stp=inputs.step.samples;   // inn = fonte emitida (Evidence), NÃO regenerada
    const maxLag=Math.trunc(0.050*fs);
    const lag=bestLag(officialEnvelope(inn,fs), officialEnvelope(stp,fs), maxLag);   // alinhamento por correlação
    const seg=Math.round(0.100*fs), lt=[];
    for(let s=0;s<8;s++){
      const oi=inn.slice(s*seg,(s+1)*seg), oo=stp.slice(s*seg+lag,(s+1)*seg+lag);
      const ri=Math.sqrt(ms(oi)), ro=Math.sqrt(ms(oo));
      const db=20*Math.log10(Math.max(ro,1e-12)/Math.max(ri,1e-12));   // pisos 1e-12
      lt.push(db); out['levelTransfer_step'+(s+1)+'_dB']=db;
    }
    let mean=0; for(const v of lt) mean+=v; if(lt.length) mean/=lt.length;
    let maxErr=0; for(const v of lt){const e=Math.abs(v-mean); if(e>maxErr)maxErr=e;}
    out.levelTransfer_maxError_dB=maxErr;
  }
  return out;
}
/* MS-14 (Behavioural Response) — SEGUNDA família composta e SEGUNDO consumidor de officialEnvelope/bestLag.
   Método oficial (AnalysisEngine::behavioural): três sub-métodos —
     attack tracking (ST-10 duro, obrigatório; ST-11 suave, opcional), consistency (hard vs soft) e overshoot (ST-10).
   PURA, agnóstica. Entradas EXPLÍCITAS (D-ENTRADAS-CIENTÍFICAS): {hard,hardSource,soft,softSource}, cada
   {samples,sampleRate}. As fontes emitidas (ST-10/ST-11) vêm do Evidence Package, NUNCA regeneradas.
   Consome os helpers COMPARTILHADOS officialEnvelope e bestLag SEM ampliar suas interfaces (maxLag=0.050·fs
   permanece na família). Condições científicas (guarda Pearson sx>0&&sy>0; overshoot: pk≤1e-12 e regime<pk·1e-3
   -> LowConfidence; trim da cauda de zeros; janelas de 100/200 ms) reproduzidas como método (D-CONDIÇÃO-CIENTÍFICA).
   Estados de qualidade oficiais: Normal, LowConfidence (overshoot) e NotApplicable (soft/consistency sem ST-11). */
function computeMS14(inputs){
  const hard=inputs.hard;
  if(!hard||!hard.samples||!hard.samples.length) return {quality:'Error'};   // ST-10 obrigatório
  const fs=hard.sampleRate, out={quality:'Normal'};
  // tracking = 100·Pearson(env_in, env_out) ALINHADO por bestLag (compensa a latência estrutural)
  const trackingPct=(cap, source)=>{
    if(!cap||!cap.samples||!cap.samples.length||!source||!source.samples||!source.samples.length) return 0;
    const outEnv=officialEnvelope(cap.samples, fs), inEnv=officialEnvelope(source.samples, fs);
    if(!inEnv.length||!outEnv.length) return 0;
    const maxLag=Math.trunc(0.050*fs);                        // política de latência: pertence à FAMÍLIA
    const lag=bestLag(inEnv, outEnv, maxLag);
    const avail=outEnv.length>lag ? outEnv.length-lag : 0, W=Math.min(inEnv.length, avail);
    if(W===0) return 0;
    let mx=0,my=0; for(let i=0;i<W;i++){mx+=inEnv[i]; my+=outEnv[i+lag];} mx/=W; my/=W;
    let sxy=0,sx=0,sy=0; for(let i=0;i<W;i++){const dx=inEnv[i]-mx, dy=outEnv[i+lag]-my; sxy+=dx*dy; sx+=dx*dx; sy+=dy*dy;}
    const p=(sx>0&&sy>0)? sxy/Math.sqrt(sx*sy):0;             // guarda Pearson
    return 100*p;
  };
  const hardPct=trackingPct(hard, inputs.hardSource);
  out.attackTracking_hard_pct=hardPct;
  if(inputs.soft&&inputs.soft.samples&&inputs.soft.samples.length){   // Soft Attack + Consistency (ST-11)
    const softPct=trackingPct(inputs.soft, inputs.softSource);
    out.hasSoft=true; out.attackTracking_soft_pct=softPct;
    out.attackConsistency_pct=Math.max(0, 100-Math.abs(hardPct-softPct));
  } else out.hasSoft=false;
  {   // Overshoot (ST-10): pico / regime, janela ancorada ao pico e limitada ao conteúdo real capturado
    const outEnv=officialEnvelope(hard.samples, fs);
    let realEnd=Math.min(outEnv.length, hard.samples.length);
    while(realEnd>0 && Math.abs(hard.samples[realEnd-1])<1e-6) realEnd--;   // não medir sobre zeros de preenchimento
    let pk=0, pkIdx=0; for(let i=0;i<realEnd;i++) if(outEnv[i]>pk){pk=outEnv[i]; pkIdx=i;}
    const settle=Math.trunc(0.10*fs), wlen=Math.trunc(0.20*fs);
    const rs=Math.min(pkIdx+settle, realEnd), re=Math.min(rs+wlen, realEnd);
    let regime=0, c=0; for(let i=rs;i<re;i++){regime+=outEnv[i]; c++;} if(c>0) regime/=c;
    const floorRel=pk*1e-3;                                   // regime mínimo = -60 dB do pico
    if(pk<=1e-12){ out.overshoot_dB=0; out.overshoot_quality='LowConfidence'; }
    else if(regime<floorRel){ out.overshoot_dB=20*Math.log10(pk/floorRel); out.overshoot_quality='LowConfidence'; }
    else { out.overshoot_dB=20*Math.log10(pk/regime); out.overshoot_quality='Normal'; }
  }
  return out;
}
/* MS-15 (Musical Behaviour) — TERCEIRA família composta e TERCEIRO consumidor de officialEnvelope.
   Método oficial (AnalysisEngine::musical): linearidade agregada da envoltória sobre a sequência de
   performance dinâmica (ST-15). Envoltória da fonte emitida (in) e da captura (out); em 12 janelas de 1 s,
   razão de energias Lk = Σout² / Σin² (guarda ein>0 -> senão 1.0); AggregateLinearity_dB = média de
   |20·log10(max(Lk,1e-12))|. PURA, agnóstica. Entradas EXPLÍCITAS (D-ENTRADAS-CIENTÍFICAS): {seq, seqSource}.
   Fonte emitida (ST-15) vem do Evidence Package, NUNCA regenerada. NÃO usa bestLag (sem alinhamento).
   Energia por janela e razão-log são aritmética privada (D-PRIMITIVA-ARITMÉTICA). */
function computeMS15(inputs){
  const seq=inputs.seq;
  if(!seq||!seq.samples||!seq.samples.length) return {quality:'Error'};   // ST-15 obrigatório
  const fs=seq.sampleRate;
  const srcSamples=(inputs.seqSource&&inputs.seqSource.samples)?inputs.seqSource.samples:[];   // fonte emitida (Evidence)
  const inEnv=officialEnvelope(srcSamples, fs), outEnv=officialEnvelope(seq.samples, fs);
  const oneSec=Math.round(fs); let aggr=0; const K=12;
  for(let k=0;k<K;k++){
    let ein=0, eout=0;
    for(let i=k*oneSec;i<(k+1)*oneSec;i++){
      if(i<inEnv.length) ein+=inEnv[i]*inEnv[i];
      if(i<outEnv.length) eout+=outEnv[i]*outEnv[i];
    }
    const Lk = ein>0 ? eout/ein : 1.0;                         // guarda: janela de entrada silenciosa -> linearidade neutra
    aggr += Math.abs(20*Math.log10(Math.max(Lk,1e-12)));       // piso 1e-12
  }
  aggr/=K;
  /* STUB CIENTÍFICO — herdado do Core (AnalysisEngine::musical). Reproducibility_pct NÃO é uma medição
     calculada: o Core publica o valor CONSTANTE 100.0, sem algoritmo associado. Aqui é reproduzido
     EXCLUSIVAMENTE por fidelidade ao Core (D-STUB-CIENTÍFICO), não como resultado de qualquer inferência
     da migração. Se o Core futuramente implementar um algoritmo de reprodutibilidade, apenas o ALGORITMO
     será substituído — preservando o mesmo identificador (Reproducibility_pct), contrato, interface e
     semântica pública. A decisão pertence ao CORE, não à migração do Laboratory. */
  return {quality:'Normal', aggregateLinearity_dB:aggr, reproducibility_pct:100.0};
}
/* officialTransfer — OBSERVAÇÃO científica COMPARTILHADA do grupo de resposta em frequência (MS-01/02/04),
   promovida na Subetapa C (paralela a officialSpectrum/officialEnvelope).
   Reproduz AnalysisEngine::essTransfer: caracterização LINEAR (LTI) do dispositivo sob teste, extraída
   por DECONVOLUÇÃO REGULARIZADA DE TIKHONOV do ESS (ST-01). Produz o conhecimento científico COMPLETO em
   suas DUAS formas canônicas, par de Fourier: { ir (resposta ao impulso, tempo, Nfull), H (resposta em
   frequência complexa, grid fixo FFT_ANALYSIS=65536) }.
   FRONTEIRA CONGELADA (D-OBSERVAÇÃO-COMPLETA / D-FRONTEIRA-DA-OBSERVAÇÃO): a observação encerra em {ir,H};
   deconvolução de Tikhonov, IFFT e FFT_ANALYSIS PERTENCEM à observação. ir e H são a observação — ambos
   retornados SEMPRE, independentemente de consumidores atuais (a MS-01 usa só H; MS-02 usará arg(H); MS-04
   usa ir). PROMOVIDA na Subetapa C após MS-01/MS-02/MS-04 confirmarem, por implementação e regressão, a
   suficiência da interface {ir,H} (D-OBSERVAÇÃO-VALIDADA) — movimentação PURAMENTE ESTRUTURAL, sem alterar
   matemática, interface, parâmetros ou fronteiras (D-SEPARAÇÃO-ESTRUTURA-vs-OTIMIZAÇÃO). Reutiliza SOMENTE
   SCI.fft; a IFFT é derivada por conjugação, ENCAPSULADA aqui (D-INFRAESTRUTURA-DERIVADA — sem SCI.ifft).
   Entradas: captura e fonte emitida do ST-01, ambas {samples, sampleRate}; a fonte vem de session.stimuli,
   NUNCA regenerada. */
function officialTransfer(capture, source){
  const cap=capture.samples, src=source.samples;
  let Nfull=1; while(Nfull<Math.max(cap.length, src.length)) Nfull<<=1;      // nextPow2Local (sem piso)
  const Yre=new Array(Nfull).fill(0), Yim=new Array(Nfull).fill(0);
  for(let i=0;i<cap.length && i<Nfull;i++) Yre[i]=cap[i];  SCI.fft(Yre,Yim); // Y = FFT(captura)
  const Xre=new Array(Nfull).fill(0), Xim=new Array(Nfull).fill(0);
  for(let i=0;i<src.length && i<Nfull;i++) Xre[i]=src[i];  SCI.fft(Xre,Xim); // X = FFT(fonte emitida)
  const LAMBDA_BASE=1e-6, Hre=new Array(Nfull), Him=new Array(Nfull);        // deconvolução de Tikhonov
  for(let i=0;i<Nfull;i++){
    const S=Xre[i]*Xre[i]+Xim[i]*Xim[i];                                     // |X|² = energia de sinal no bin
    const ratio = S>0 ? 0 : 1e12;                                           // noise vazio -> Nf=0
    const denom = S + LAMBDA_BASE*(1+ratio);                                // sempre > 0 (regularização)
    Hre[i]=(Yre[i]*Xre[i]+Yim[i]*Xim[i])/denom;                            // H = Y·conj(X)/denom
    Him[i]=(Yim[i]*Xre[i]-Yre[i]*Xim[i])/denom;
  }
  const irRe=Hre.slice(), irIm=new Array(Nfull);                            // ir = IFFT(H) parte real
  for(let i=0;i<Nfull;i++) irIm[i]=-Him[i];                                 // conjugação: ir=Re(FFT(conj(H)))/Nfull
  SCI.fft(irRe, irIm);
  const ir=new Array(Nfull); for(let i=0;i<Nfull;i++) ir[i]=irRe[i]/Nfull;
  const NA=65536, Hre2=new Array(NA).fill(0), Him2=new Array(NA).fill(0);   // H = FFT(ir, FFT_ANALYSIS)
  for(let i=0;i<ir.length && i<NA;i++) Hre2[i]=ir[i];  SCI.fft(Hre2,Him2);
  return {ir, H:{re:Hre2, im:Him2, nfft:NA}};                               // observação COMPLETA {ir, H}
}
/* MS-01 (Frequency Response) — PRIMEIRA família do grupo espectral de resposta e PRIMEIRA a produzir CURVA.
   Método oficial (AnalysisEngine::freqResponse): representação de MAGNITUDE da observação essTransfer —
   |H| em dB na banda [20,20000]. PURA. Entradas EXPLÍCITAS: captura + fonte ST-01. Consome apenas H da
   observação; a curva é a REPRESENTAÇÃO específica (não a observação). Saída oficial: uma curva; nenhum
   escalar oficial (os DBG_FR do Core são diagnósticos — descartados por D-SAÍDA-OFICIAL). */
function computeMS01(capture, source){
  const fs=capture.sampleRate;
  const obs=officialTransfer(capture, source);          // observação científica compartilhada {ir, H}
  const H=obs.H, N=H.nfft, half=N>>1, BAND_LO=20, BAND_HI=20000;
  const x=[], y=[];
  for(let i=0;i<half;i++){
    const f=i*fs/N;                                     // binFreq(i, FFT_ANALYSIS, fs)
    if(f<BAND_LO||f>BAND_HI) continue;
    const mag=Math.hypot(H.re[i], H.im[i]);
    x.push(f); y.push(20*Math.log10(Math.max(mag,1e-12)));   // piso 1e-12
  }
  return {curve:{name:'Magnitude', xUnit:'Hz', yUnit:'dB', x, y}};
}
/* MS-02 (Phase Response) — SEGUNDO consumidor da observação essTransfer e TESTE de sua suficiência
   (D-CONSUMIDOR-DE-VALIDAÇÃO). Representação de FASE: arg(H) desdobrada, em graus, na banda [20,20000].
   Consome APENAS H (não usa ir); NÃO amplia a interface {ir,H}, NÃO adiciona parâmetro/constante/
   responsabilidade à observação — a auditoria confirmou a suficiência.
   O DESDOBRAMENTO (unwrap) é transformação de REPRESENTAÇÃO, não observação: a fase embrulhada ([-π,π]) e a
   contínua (unwrapped) representam EXATAMENTE o mesmo H — o unwrap só muda a forma de apresentação, não
   produz conhecimento novo (D-OBSERVAÇÃO-vs-SAÍDA). O unwrap acumula desde o bin DC sobre TODOS os bins; a
   banda apenas decide quais pontos EMITIR. */
function computeMS02(capture, source){
  const fs=capture.sampleRate;
  const obs=officialTransfer(capture, source);         // MESMA observação da MS-01, sem alteração
  const H=obs.H, N=H.nfft, half=N>>1, BAND_LO=20, BAND_HI=20000, PI=Math.PI;
  const x=[], y=[];
  let prev=0, unwrapped=0, first=true;
  for(let i=0;i<half;i++){
    const ph=Math.atan2(H.im[i], H.re[i]);             // arg(H[i])
    if(!first){ let d=ph-prev; while(d>PI)d-=2*PI; while(d<-PI)d+=2*PI; unwrapped+=d; }  // desdobra desde DC
    else { unwrapped=ph; first=false; }
    prev=ph;
    const f=i*fs/N;                                     // binFreq(i, FFT_ANALYSIS, fs)
    if(f<BAND_LO||f>BAND_HI) continue;                  // banda: só decide EMISSÃO (unwrap já acumulou)
    x.push(f); y.push(unwrapped*180/PI);
  }
  return {curve:{name:'Phase', xUnit:'Hz', yUnit:'deg', x, y}};
}
/* MS-04 (Impulse Response) — TERCEIRO consumidor de essTransfer e CONSUMIDOR FINAL (primeiro de ir).
   Método oficial (AnalysisEngine::impulseResp): representação TEMPORAL da resposta ao impulso. Consome
   APENAS ir da observação (não usa H), SEM ampliar a interface {ir,H} — a auditoria confirmou a suficiência.
   Toda a lógica abaixo é REPRESENTAÇÃO da família (não observação): localizar o pico, normalizar por ele
   (guarda pk>0), decimar min/max (~6000 pts, preservando picos/vales), eixo temporal em ms, curva oficial.
   PeakIndex_samples é escalar OFICIAL (D-ESCALAR-OFICIAL — publicado mesmo sem consumidor); DBG_IR_* do Core
   são diagnósticos e NÃO são reproduzidos (D-SAÍDA-OFICIAL). */
function computeMS04(capture, source){
  const fs=capture.sampleRate;
  const obs=officialTransfer(capture, source);         // MESMA observação, sem alteração; consome só ir
  const h=obs.ir.slice();                              // cópia: a família NÃO muta a observação
  let pk=0, pkIdx=0;                                   // pico da IR (referência de normalização) — REPRESENTAÇÃO
  for(let i=0;i<h.length;i++){const a=Math.abs(h[i]); if(a>pk){pk=a; pkIdx=i;}}
  if(pk>0){ for(let i=0;i<h.length;i++) h[i]/=pk; }    // normaliza pico=1 (guarda pk>0)
  const x=[], y=[], M=h.length, target=6000;           // decimação min/max (USE_FULL_IR ativo no Core)
  if(M<=target){
    for(let i=0;i<M;i++){ x.push(i/fs*1000); y.push(h[i]); }
  } else {
    const buckets=target>>1;                           // 3000
    for(let bk=0;bk<buckets;bk++){
      const lo=Math.floor(bk*M/buckets), hi=Math.floor((bk+1)*M/buckets);
      if(lo>=hi) continue;
      let mnI=lo, mxI=lo;
      for(let i=lo+1;i<hi;i++){ if(h[i]<h[mnI])mnI=i; if(h[i]>h[mxI])mxI=i; }
      const f1=Math.min(mnI,mxI), f2=Math.max(mnI,mxI);
      x.push(f1/fs*1000); y.push(h[f1]);
      if(f2!==f1){ x.push(f2/fs*1000); y.push(h[f2]); }
    }
  }
  return {curve:{name:'Impulse Response', xUnit:'ms', yUnit:'norm', x, y}, peakIndex_samples:pkIdx};
}
/* MS-03 (Group Delay) — PRIMEIRA família DEPENDENTE DE OUTRA FAMÍLIA (não de observação compartilhada).
   Método oficial (AnalysisEngine::groupDelay): derivada da fase — τ = −dφ/dω sobre a curva de fase,
   convertida para ms. PURA.
   CONTRATO CIENTÍFICO (D-CONTRATO-ENTRE-FAMÍLIAS / D-DEPENDÊNCIA-DE-REPRESENTAÇÃO / D-DEPENDÊNCIA-MÍNIMA):
   a entrada `phaseCurve` é a REPRESENTAÇÃO OFICIAL publicada pela MS-02 ({x:Hz, y:graus, unwrapped, banda}).
   A MS-03 depende do CONTRATO CIENTÍFICO da MS-02 — não de estado interno, observação intermediária ou
   conveniência de implementação. NÃO retorna a officialTransfer; não acessa H/ir/FFT; não recalcula fase.
   A banda já vem embutida na curva (representação da MS-02) — a MS-03 apenas a deriva (menor representação
   suficiente).
   AGNÓSTICA quanto à ORIGEM da curva: não sabe se foi produzida pelo Core, pelo Laboratory, carregada de um
   Evidence Package ou de outra implementação compatível — seu contrato é EXCLUSIVAMENTE a curva oficial de
   fase, uma representação científica, não um caminho de obtenção.
   Saída: uma curva oficial "Group Delay"; nenhum escalar; nenhum DBG. */
function computeMS03(phaseCurve){

  const x=[], y=[];

    const dw=2*Math.PI*(px[i+1]-px[i-1]);            // diferença central da frequência angular (Hz → rad/s)
    if(Math.abs(dw)<1e-12) continue;                 // guarda DEFENSIVA (não exercitável pela curva oficial)
    const tau_s=-dphi/dw;                            // group delay = −dφ/dω (s)

/* Sub-etapa 3.0 — consumo do Evidence Package pelo Laboratory.
   isEvidenceFormat: reconhece o CONTRATO estrutural do pacote de evidência (arrays stimuli+captures,
   conforme o EvidenceSerializer) — reconhecimento positivo da estrutura esperada, sem heurísticas
   nem dependência de "ausência de analysis".
   fromEvidence: reconstrói a Session INTEGRALMENTE a partir da evidência (WAVs + metadados) e
   COMPUTA toda a ciência no Laboratory via LabEngine.run (MS-01..15 a partir de captures+stimuli).
   NUNCA consulta analysis.json — hasAnalysis:false indica ausência de análise de backend, não de
   ciência: a derivação científica é responsabilidade do consumidor oficial (ADR-0003). */
function isEvidenceFormat(man){
  return !!man && Array.isArray(man.stimuli) && Array.isArray(man.captures);

function fromEvidence(f,man,file){
  const readJson=name=>(man[name]&&f[man[name]])?JSON.parse(asText(f[man[name]])):{};
  const ses=readJson('session'),hw=readJson('hardware'),acq=readJson('acquisition');
  const caps=(man.captures||[]).map(c=>({stimulus:c.code,file:c.file,wav:f[c.file]?parseWAV(asAB(f[c.file])):null})).filter(c=>c.wav);
  // D-EVIDENCE-DOMÍNIO: estímulos emitidos (fontes) pertencem ao MESMO domínio científico das capturas.
  // A ingestão apenas DISPONIBILIZA as fontes (parse simétrico a captures) — não interpreta nem transforma.
  const stims=(man.stimuli||[]).map(s=>({stimulus:s.code,file:s.file,wav:f[s.file]?parseWAV(asAB(f[s.file])):null})).filter(s=>s.wav);
  const session={provenance:'evidence',source:file.name,
    meta:{device:hw.deviceName,sampleRate:hw.sampleRate,mode:hw.channels,timestamp:ses.timestamp},
    captures:caps,stimuli:stims,primary:0,hasAnalysis:false,acquisition:acq};
  session.metrics=LabEngine.run(session);   // pipeline Session -> LabEngine -> MS-01..15 (ciência do consumidor oficial)

async function fromAamp(file){
  const f=readZipStore(await file.arrayBuffer());
  if(!f['manifest.json'])throw new Error('manifest.json ausente no .aamp');
  const man=JSON.parse(asText(f['manifest.json']));
  if(isEvidenceFormat(man))return fromEvidence(f,man,file);
  const an=man.analysis&&f[man.analysis]?JSON.parse(asText(f[man.analysis])):null;
  const caps=(man.capture||[]).map(c=>({stimulus:c.stimulus,file:c.file,wav:f[c.file]?parseWAV(asAB(f[c.file])):null})).filter(c=>c.wav);
  let pr=caps.findIndex(c=>c.file===man.primaryCapture);if(pr<0)pr=0;
  const meta=(an&&an.meta)||{};
  return {provenance:'normative',source:file.name,
    meta:{device:man.device||meta.device,sampleRate:man.sampleRate||meta.sampleRate,mode:man.mode||meta.mode,timestamp:man.timestamp||meta.timestamp},
    captures:caps,primary:pr,metrics:normalizeMetrics(an),hasAnalysis:!!an,acquisition:man.acquisition||null};}

  // usado por cálculo, hover, marcadores nem export (esses leem s.x/s.y integrais). Preserva
  // picos/vales (min E max por coluna de pixel), então nenhuma feição visível se perde ao afastar
  // o zoom. Ao aproximar o zoom, o range visível encolhe e o mesmo pw revela mais detalhe — até

  _idxBefore(x,v){let lo=0,hi=x.length-1;if(v<=x[0])return 0;if(v>=x[hi])return hi;while(hi-lo>1){const m=(lo+hi)>>1;(x[m]<=v)?lo=m:hi=m;}return lo;}

      c.font='8px Roboto Mono';const lx=x+3;if(lx>_lblR+7){c.fillStyle='rgba(190,205,216,.6)';c.textAlign='left';c.fillText(m.label,lx,t+9);_lblR=lx+c.measureText(m.label).width;}});

          const X=this.xPix(xv),Y=this.yPix(yv);if(X<l-2||X>l+pw+2){started=false;continue;}started?c.lineTo(X,Y):c.moveTo(X,Y);started=true;}

      this.opt.confMask.forEach(m=>{const A=this.xPix(m[0]),B=this.xPix(m[1]);if(Math.abs(B-A)<1)return;
        const x0=Math.min(A,B),w=Math.abs(B-A),cx=x0+w/2;c.fillStyle='rgba(6,10,14,.62)';c.fillRect(x0,t,w,ph);   // sombreado preservado
        if(w>=_lw+6&&cx-_lw/2>_cr+8){c.fillStyle='rgba(120,140,150,.55)';c.textAlign='center';c.fillText(_lc,cx,t+ph-6);_cr=cx+_lw/2;}});}  // rótulo na base, sem sobrepor curvas nem a si mesmo
    this.cursors.forEach((cxv,idx)=>{const X=this.xPix(cxv);if(X<l||X>l+pw)return;
      c.strokeStyle='rgba(230,240,247,.7)';c.lineWidth=1;c.beginPath();c.moveTo(X,t);c.lineTo(X,t+ph);c.stroke();
      c.fillStyle='rgba(230,240,247,.92)';c.font='10px Roboto Mono';c.textAlign='left';c.fillText(idx===0?'M1':'M2',X+3,t+ph-5);
      this.series.forEach(s=>{if(!s.visible)return;const Y=this.yPix(s.y[this.nearest(s,cxv)]);if(Y<t||Y>t+ph)return;const col=s.color||this.opt.trace;c.fillStyle=col;c.shadowColor=col;c.shadowBlur=6;c.beginPath();c.arc(X,Y,3,0,7);c.fill();c.shadowBlur=0;});});
    c.restore();
    const cx=this.cursorX!=null?this.cursorX:this.extCursor;
    if(cx!=null){const X=this.xPix(cx);if(X>=l&&X<=l+pw){c.strokeStyle='rgba(127,166,188,.6)';c.setLineDash([2,3]);c.beginPath();c.moveTo(X,t);c.lineTo(X,t+ph);c.stroke();c.setLineDash([]);}}
    if(this.cursorY!=null&&this.cursorX!=null){const Y=this.yPix(this.cursorY);if(Y>=t&&Y<=t+ph){c.strokeStyle='rgba(127,166,188,.35)';c.setLineDash([2,3]);c.beginPath();c.moveTo(l,Y);c.lineTo(l+pw,Y);c.stroke();c.setLineDash([]);}}
    c.strokeStyle='#05080B';c.strokeRect(l+.5,t+.5,pw,ph);}
  nearest(s,x){let lo=0,hi=s.x.length-1;while(hi-lo>1){const m=(lo+hi)>>1;(s.x[m]<x)?lo=m:hi=m;}return Math.abs(s.x[lo]-x)<Math.abs(s.x[hi]-x)?lo:hi;}
  showTip(px,py,xv){const rows=this.series.filter(s=>s.visible).map(s=>{const i=this.nearest(s,xv);return {name:s.name,col:s.color||this.opt.trace,y:s.y[i]};});
    this.tip.innerHTML=`<div class="tx">${this.fmtNum(xv)} ${this.opt.xUnit}</div>`+rows.map(r=>`<div class="row"><span class="sw" style="background:${r.col};color:${r.col}"></span>${T(r.name)}: ${this.fmtNum(r.y)} ${this.opt.yUnit}</div>`).join('');
    this.tip.style.display='block';const tw=this.tip.offsetWidth,th=this.tip.offsetHeight;let L=px+14;if(L+tw>this.W)L=px-tw-14;let T=py+12;if(T+th>this.H)T=py-th-12;

  bind(){const cv=this.cv;
    cv.addEventListener('mousemove',e=>{const R=cv.getBoundingClientRect();const px=e.clientX-R.left,py=e.clientY-R.top;const{l,r,t,b}=this.pad,pw=this.W-l-r,ph=this.H-t-b;

    cv.addEventListener('mousedown',e=>{const R=cv.getBoundingClientRect();const px=e.clientX-R.left,py=e.clientY-R.top;
      const{l,r,t,b}=this.pad,pw=this.W-l-r,ph=this.H-t-b;const inPlot=px>=l&&px<=l+pw&&py>=t&&py<=t+ph;
      const selMode=(this.opt.mode==='measure'||this.opt.mode==='local');

      else{this.pan={px,py,x0:this.vx0,x1:this.vx1,y0:this.vy0,y1:this.vy1};this.moved=false;this.click=inPlot?{x:this.xVal(px)}:null;}});

function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<1.5?1:n<3?2:n<7?5:10)*p;}

/* ===== instrumentos (widgets) ===== */
const DOMAINS={investigation:'--d-integrity',integrity:'--d-integrity',frequency:'--d-frequency',harmonics:'--d-harmonics',temporal:'--d-temporal',imd:'--d-imd',noise:'--d-noise',impulse:'--d-impulse'};
/* mapa do Laboratório completo — toda decisão de hoje hospeda estas famílias sem reescrita.
   ativos = ambientes construídos (presentes nesta medição); demais = planejados/sem dados. */
const ECOSYSTEM=[
  {cat:'Confiança',items:[['integrity','Integridade']]},
  {cat:'Amplitude & fase',items:[['frequency','Frequência'],['phase','Fase'],['groupdelay','Atraso de grupo']]},
  {cat:'Domínio do tempo',items:[['impulse','Impulsiva'],['envelope','Envelope'],['decay','Decaimento de energia'],['temporal','Resposta temporal']]},
  {cat:'Distorção & ruído',items:[['imd','IMD'],['harmonics','Harmônicos · THD'],['thdn','THD+N'],['noise','Ruído']]},
  {cat:'Espectro · tempo',items:[['waterfall','Waterfall'],['spectrogram','Espectrograma'],['rtfft','FFT em tempo real']]},
  {cat:'Tempo real',items:[['monitor','Monitoramento ao vivo'],['playspec','Espectro na reprodução']]},
  {cat:'Comparação',items:[['origvschar','Original vs caracterizado']]}
];
const COLORMAP={integrity:'--d-integrity',frequency:'--d-frequency',phase:'--d-frequency',groupdelay:'--d-frequency',
  impulse:'--d-impulse',envelope:'--d-impulse',decay:'--d-impulse',temporal:'--d-impulse',
  imd:'--d-harmonics',harmonics:'--d-harmonics',thdn:'--d-harmonics',noise:'--d-noise',
  waterfall:'--d-temporal',spectrogram:'--d-temporal',rtfft:'--d-imd',
  monitor:'--d-imd',playspec:'--d-imd',origvschar:'--d-temporal'};
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(v,d)=>(v==null||!isFinite(v))?'—':v.toFixed(d==null?2:d);
const charts=[];
let chartResizeRAF=0;
function clearCharts(){if(chartResizeRAF){cancelAnimationFrame(chartResizeRAF);chartResizeRAF=0;}charts.forEach(c=>{try{if(c&&c.destroy)c.destroy();}catch(e){}});charts.length=0;for(const k in SYNC)delete SYNC[k];}
function resizeCharts(){chartResizeRAF=0;charts.forEach(c=>{try{if(c&&c.resize)c.resize();}catch(e){}});}
function scheduleChartResize(){if(chartResizeRAF)return;chartResizeRAF=requestAnimationFrame(resizeCharts);}

function lamp(state,label){return `<span class="lamp ${state}"><i></i>${label}</span>`;}
function meterBar(o){
  const {label,value,min,max,unit='',decimals=1,zones=[],marker=null,ticks=[min,(min+max)/2,max],stateColor=null}=o;
  const pct=v=>Math.max(0,Math.min(100,(v-min)/(max-min)*100));
  const fillPct=(value==null||!isFinite(value))?0:pct(value);
  const zoneHTML=zones.map(z=>`<span class="mz" style="left:${pct(z.from)}%;width:${pct(z.to)-pct(z.from)}%;background:${z.color}"></span>`).join('');
  const tickHTML=ticks.map(tt=>`<span class="mt" style="left:${pct(tt)}%"></span><span class="mtl" style="left:${pct(tt)}%">${tt}</span>`).join('');
  const markHTML=(marker!=null&&isFinite(marker))?`<span class="mk" style="left:${pct(marker)}%"></span>`:'';
  const fill=stateColor?`background:${stateColor};box-shadow:0 0 14px ${stateColor}`:`background:var(--c);box-shadow:0 0 14px var(--c)`;
  return `<div class="meter"><div class="meter-top"><span class="meter-lab">${label}</span><span class="meter-read">${(value==null||!isFinite(value))?'—':value.toFixed(decimals)}<i>${unit}</i></span></div>
    <div class="meter-track">${zoneHTML}<span class="meter-fill" style="width:${fillPct}%;${fill}"></span>${markHTML}${tickHTML}</div></div>`;
}

const FBANDS=[['Sub',20,60],['Graves',60,250],['Méd-grave',250,500],['Médio',500,2000],['Méd-agudo',2000,6000],['Agudo',6000,20000]];
function nearestIdx(x,v){let lo=0,hi=x.length-1;while(hi-lo>1){const m=(lo+hi)>>1;(x[m]<v)?lo=m:hi=m;}return Math.abs(x[lo]-v)<Math.abs(x[hi]-v)?lo:hi;}
function smoothFracOct(x,y,frac){if(!frac)return y.slice();const half=1/(2*frac),out=new Array(y.length);
  for(let i=0;i<y.length;i++){const lo=Math.log2(x[i])-half,hi=Math.log2(x[i])+half;let s=0,n=0;
    for(let j=0;j<x.length;j++){const lx=Math.log2(x[j]);if(lx>=lo&&lx<=hi&&isFinite(y[j])){s+=y[j];n++;}}out[i]=n?s/n:y[i];}return out;}
/* ===== FPERF — instrumentação TEMPORÁRIA da abertura da aba Frequência (OFF por padrão).
   Ativar: window.AAMP_FPERF=true no console, ou abrir a página com ?fperf na URL.
   Cronometra de showDomain('frequency') até o primeiro frame pintado, por etapa (console.table).
   Só age quando o domínio é 'frequency' — nenhuma outra aba é afetada. Remover após diagnóstico. ===== */
const FPERF=(()=>{
  const on=()=>{try{return !!window.AAMP_FPERF||String(location.search||'').indexOf('fperf')>=0;}catch(e){return false;}};
  const now=()=>{try{return performance.now();}catch(e){return Date.now();}};
  let t0=0,last=0,rows=[],active=false,note='';
  return {
    begin(id){active=(on()&&id==='frequency');if(!active)return;t0=last=now();rows=[];note='';rows.push({etapa:'entrada em showDomain',ms:0,acumulado:0});},
    note(s){if(active)note=(note?note+' ':'')+s;},   // metadados p/ o cabeçalho (ex.: nº de pontos de MS-01)
    mark(label){if(!active)return;const t=now();rows.push({etapa:label,ms:+(t-last).toFixed(1),acumulado:+(t-t0).toFixed(1)});last=t;},
    end(){if(!active)return;const t=now();rows.push({etapa:'primeiro frame desenhado',ms:+(t-last).toFixed(1),acumulado:+(t-t0).toFixed(1)});
      const total=+(t-t0).toFixed(1);
      const line='Frequência total='+total+'ms'+(note?' '+note:'')+' | '+rows.map(r=>r.etapa+':'+r.ms).join(' | ');
      console.log('%c[FPERF] Aba Frequência — '+total+' ms até o primeiro frame','color:#2977E7;font-weight:600');
      if(console.table)console.table(rows);else rows.forEach(r=>console.log(r.etapa,r.ms+'ms','(acum '+r.acumulado+'ms)'));
      try{window.__AAMP_LAST_FPERF={total:total,note:note,rows:rows.slice()};}catch(e){}   // inspeção via DevTools
      try{if(typeof send==='function')send('fperf',{msg:line});}catch(e){}                 // grava no diag_log.txt ([FPERF])
      active=false;}
  };
})();

/* Suavização fracional de oitava LOCAL, usada EXCLUSIVAMENTE por buildFrequencyEnv.
   Bit-idêntica a smoothFracOct (mesma janela, mesma ordem de soma crescente, mesmo filtro isFinite),
   porém O(n·W) por janela deslizante de dois ponteiros monotônicos — o eixo de frequência x é
   ascendente, então a janela em log2 [lx[i]-half, lx[i]+half] avança monotonicamente. Se x não for
   ascendente, cai no algoritmo O(n²) idêntico ao compartilhado. NÃO altera o helper compartilhado. */
function smoothFracOctFq(x,y,frac){if(!frac)return y.slice();
  const N=y.length,half=1/(2*frac),out=new Array(N),lx=new Array(N);
  let asc=true;for(let j=0;j<N;j++){lx[j]=Math.log2(x[j]);if(j&&lx[j]<lx[j-1])asc=false;}
  if(!asc){for(let i=0;i<N;i++){const lo=lx[i]-half,hi=lx[i]+half;let s=0,n=0;
      for(let j=0;j<N;j++){if(lx[j]>=lo&&lx[j]<=hi&&isFinite(y[j])){s+=y[j];n++;}}out[i]=n?s/n:y[i];}return out;}
  let jlo=0,jhi=-1;
  for(let i=0;i<N;i++){const lo=lx[i]-half,hi=lx[i]+half;
    while(jlo<N&&lx[jlo]<lo)jlo++;                       // 1ª posição com lx>=lo (monotônico)
    if(jhi<jlo-1)jhi=jlo-1;                              // jhi = última posição com lx<=hi
    while(jhi+1<N&&lx[jhi+1]<=hi)jhi++;
    let s=0,n=0;for(let j=jlo;j<=jhi;j++){if(isFinite(y[j])){s+=y[j];n++;}}  // soma fresca, ordem crescente
    out[i]=n?s/n:y[i];}
  return out;}

function crossInterp(x,y,i,thr){const t=(thr-y[i-1])/(y[i]-y[i-1]);const lx=Math.log2(x[i-1])+t*(Math.log2(x[i])-Math.log2(x[i-1]));return Math.pow(2,lx);}
function freqStats(x,y){let pk=0;for(let i=1;i<y.length;i++)if(y[i]>y[pk])pk=i;
  const thr=y[pk]-3,cr=[];for(let i=1;i<y.length;i++)if(isFinite(y[i-1])&&isFinite(y[i])&&(y[i-1]-thr)*(y[i]-thr)<0)cr.push(crossInterp(x,y,i,thr));
  const lo3=cr.length?cr[0]:null,hi3=cr.length>=2?cr[cr.length-1]:null;
  let mn=Infinity,mx=-Infinity,sum=0,n=0,sx=0,sy=0,sxx=0,sxy=0;
  for(let i=0;i<y.length;i++){if(!isFinite(y[i]))continue;if((lo3==null||x[i]>=lo3)&&(hi3==null||x[i]<=hi3)){
    if(y[i]<mn)mn=y[i];if(y[i]>mx)mx=y[i];sum+=y[i];const lx=Math.log2(x[i]);n++;sx+=lx;sy+=y[i];sxx+=lx*lx;sxy+=lx*y[i];}}
  const tilt=n>1?(n*sxy-sx*sy)/(n*sxx-sx*sx):null;
  return {pkF:x[pk],pkV:y[pk],lo3,hi3,bw:(lo3!=null&&hi3!=null)?hi3-lo3:null,ripple:isFinite(mn)?mx-mn:null,mean:n?sum/n:null,tilt};}
function bandLevels(x,y){return FBANDS.map(([nm,lo,hi])=>{let s=0,n=0;for(let i=0;i<x.length;i++)if(x[i]>=lo&&x[i]<hi&&isFinite(y[i])){s+=y[i];n++;}return {nm,db:n?s/n:null};});}
function bandBars(L){const vs=L.map(b=>b.db).filter(v=>v!=null);if(!vs.length)return '';const mn=Math.min(...vs)-2,mx=Math.max(...vs)+2;
  return '<div class="bands">'+L.map(b=>{const h=b.db==null?0:Math.max(3,(b.db-mn)/(mx-mn)*100);
    return `<div class="band"><div class="band-track"><div class="band-fill" style="height:${h}%"></div></div><div class="band-val">${b.db==null?'—':b.db.toFixed(1)}</div><div class="band-lab">${T(b.nm)}</div></div>`;}).join('')+'</div>';}

function crossOut(x,y,i,tgt,dir,below){for(let k=i;k>0&&k<x.length-1;k+=dir){const a=y[k],b=y[k+dir];const cr=below?(a>tgt&&b<=tgt):(a<tgt&&b>=tgt);if(cr){const t=(tgt-a)/(b-a),l1=Math.log2(x[k]),l2=Math.log2(x[k+dir]);return Math.pow(2,l1+t*(l2-l1));}}return null;}
function detectPeaks(x,y,minProm,sign){const yy=sign>0?y:y.map(v=>-v),n=yy.length,out=[];
  for(let i=1;i<n-1;i++){if(!(yy[i]>yy[i-1]&&yy[i]>=yy[i+1]))continue;
    let l=i;while(l>0&&yy[l-1]<=yy[i])l--;let lmin=yy[i];for(let k=i;k>=l;k--)lmin=Math.min(lmin,yy[k]);
    let r=i;while(r<n-1&&yy[r+1]<=yy[i])r++;let rmin=yy[i];for(let k=i;k<=r;k++)rmin=Math.min(rmin,yy[k]);
    const prom=yy[i]-Math.max(lmin,rmin);if(prom<minProm)continue;
    const L=y[i],tgt=sign>0?L-3:L+3,below=sign>0;
    const fL=crossOut(x,y,i,tgt,-1,below),fR=crossOut(x,y,i,tgt,1,below);
    const bw=(fL&&fR)?fR-fL:null,Q=bw?x[i]/bw:null;
    out.push({f:x[i],level:y[i],prom,fL,fR,bw,Q,a:(fL||x[l]),b:(fR||x[r])});}

function steepest(x,y){let bi=1,bs=0;for(let i=1;i<x.length-1;i++){const s=(y[i+1]-y[i-1])/(Math.log2(x[i+1])-Math.log2(x[i-1]));if(Math.abs(s)>Math.abs(bs)){bs=s;bi=i;}}

function rangeStats(curve,a,b){const x=curve.x,y=curve.y;let mn=Infinity,mx=-Infinity,sum=0,n=0,sx=0,sy=0,sxx=0,sxy=0,pkI=-1,ntI=-1;

  if(!n)return null;const slope=n>1?(n*sxy-sx*sy)/(n*sxx-sx*sx):null;

  function renderConformance(st){const lo=st.lo3||fr.x[0],hi=st.hi3||fr.x[fr.x.length-1];

  function recompute(){FPERF.mark('entrada em recompute');let y=rawMag.slice();

    for(let i=0;i<fr.x.length;i++){const below=dispMag[i]<floor;if(below&&rs==null)rs=fr.x[i];if((!below||i===fr.x.length-1)&&rs!=null){if(fr.x[i]-rs>0)mask.push([rs,fr.x[i]]);rs=null;}}

    const notches=detectPeaks(fr.x,dispMag,1.5,-1).slice(0,4).map(p=>Object.assign({type:'Notch'},p));FPERF.mark('detectNotches');
    const sl=steepest(fr.x,dispMag);feats=peaks.concat(notches);feats.push({type:'Inclinação máx',f:sl.f,slope:sl.slope,a:sl.a,b:sl.b});

    feats.sort((p,q)=>p.f-q.f);if(curFeat)curFeat=feats.find(f=>f.type===curFeat.type&&Math.abs(f.f-curFeat.f)<1)||null;FPERF.mark('steepest + roll-off + feats');
    if(!inited){inited=true;const dom=feats.filter(f=>f.type==='Pico'||f.type==='Notch').sort((a,b)=>b.prom-a.prom)[0];
      if(dom){curFeat=dom;curBand={a:dom.a,b:dom.b};allCharts().forEach(c=>c.setBand(curBand));}}
    renderConformance(st);renderVerdict(st);renderAuto();renderFeatures();renderPhenomenon();renderTonal(st);renderCursor();FPERF.mark('investigação automática + cards + painel lateral');}

  const onSel=band=>{curBand=band;curFeat=null;featEl.querySelectorAll('.feat').forEach(e=>e.classList.remove('on'));renderLocal(band);renderPhenomenon();};
  magChart.onSelect=onSel;

  ws.querySelector('#fq-smooth').value=String(smooth);
  ws.querySelector('#fq-smooth').onchange=e=>{smooth=+e.target.value;recompute();};
  ws.querySelector('#fq-ref').onchange=e=>{ref=e.target.value;recompute();};

  if(focus&&focus.f){const ft=feats.filter(f=>f.type==='Pico'||f.type==='Notch').sort((a,b)=>Math.abs(a.f-focus.f)-Math.abs(b.f-focus.f))[0];if(ft)selectFeature(ft);}
}

/* ===== domínio Resposta Impulsiva (bancada temporal) ===== */
function etcToDb(y){let mx=0;for(const v of y){const a=Math.abs(v);if(a>mx)mx=a;}mx=mx||1;
  return y.map(v=>{const d=20*Math.log10(Math.abs(v)/mx);return isFinite(d)?Math.max(d,-120):-120;});}
function schroeder(x,y){const idx=[];for(let i=0;i<x.length;i++)if(x[i]>=0)idx.push(i);
  const N=idx.length,e=new Array(N);let cum=0;for(let k=N-1;k>=0;k--){const v=y[idx[k]];cum+=v*v;e[k]=cum;}
  const e0=e[0]||1,xs=idx.map(i=>x[i]),ys=e.map(v=>{const d=10*Math.log10(v/e0);return isFinite(d)?Math.max(d,-120):-120;});return {x:xs,y:ys};}
function crossTime(xs,ys,tgt){for(let i=1;i<xs.length;i++){if((ys[i-1]-tgt)*(ys[i]-tgt)<=0&&ys[i-1]!==ys[i]){const t=(tgt-ys[i-1])/(ys[i]-ys[i-1]);return xs[i-1]+t*(xs[i]-xs[i-1]);}}return null;}
function linFitRange(xs,ys,yHi,yLo){let n=0,sx=0,sy=0,sxx=0,sxy=0;for(let i=0;i<xs.length;i++){const v=ys[i];if(v<=yHi&&v>=yLo){n++;sx+=xs[i];sy+=v;sxx+=xs[i]*xs[i];sxy+=xs[i]*v;}}return n>1?(n*sxy-sx*sy)/(n*sxx-sx*sx):null;}
function timeStats(x,y,a,b){let pk=0,sq=0,n=0,pi=-1;for(let i=0;i<x.length;i++){if(x[i]<a||x[i]>b)continue;const av=Math.abs(y[i]);if(av>pk){pk=av;pi=i;}sq+=y[i]*y[i];n++;}return n?{peak:pk,peakT:x[pi],rms:Math.sqrt(sq/n),energy:sq,n}:null;}

/* MS-04: o engine emite APENAS a curva de IR ("Impulse Response"); a curva de envelope pode não
   vir no payload. Este helper devolve {ir, env}: usa o envelope explícito se existir (ex.: fixtures
   .aamp), senão DERIVA um envelope de exibição a partir da própria IR — mesma prática já usada no
   Laboratório para Schroeder/ETC (curvas derivadas da IR para representação). NÃO altera métrica,
   DSP ou payload; é apenas a representação da bancada temporal a partir do dado disponível.
   Regex ampliadas para casar nomenclatura EN ("Impulse Response") e PT ("impulso"/"envoltória"). */
function ms04Curves(m04){
  if(!m04||!m04.curves)return {ir:null,env:null};
  const ir=m04.curves.find(c=>/impuls/i.test(c.name))||null;
  let env=m04.curves.find(c=>/envelope|envolt/i.test(c.name))||null;
  if(!env&&ir&&ir.x&&ir.x.length){
    const y=ir.y,n=y.length,mag=new Array(n);
    for(let i=0;i<n;i++)mag[i]=Math.abs(y[i]);
    const w=Math.max(1,Math.round(n/600)),sm=new Array(n);   // envelope: |IR| com suavização curta
    let acc=0;for(let i=0;i<Math.min(n,w+1);i++)acc+=mag[i];  // média móvel O(n)
    for(let i=0;i<n;i++){const lo=Math.max(0,i-w),hi=Math.min(n-1,i+w);
      if(i>0){const add=i+w;if(add<n)acc+=mag[add];const rem=i-w-1;if(rem>=0)acc-=mag[rem];}
      sm[i]=acc/(hi-lo+1);}
    env={name:'Envelope (derivado da IR)',xUnit:ir.xUnit||'ms',yUnit:'',x:ir.x.slice(),y:sm,derived:true};
  }
  return {ir,env};
}

function buildImpulseEnv(stage,focus,pc){
  const m04=LAB.getById('MS-04');
  const {ir:irc,env:envc}=ms04Curves(m04);
  const sc=k=>M.metrics.scalars[k];
  if(!(irc&&irc.x&&irc.x.length)){stage.className='scroll';
    const cap=M.captures.find(c=>/ir/i.test(c.file)||/impuls/i.test(c.stimulus||''))||pc;
    const head=document.createElement('div');head.className='ws-verdict';
    head.innerHTML=`<div class="ws-title"><div class="vt-q">${T('Como o sistema responde no tempo?')}</div><div class="vt-h">${T('Resposta impulsiva')}</div></div><div class="ws-answer"></div><div class="vtrust warn"><i></i>${T('IR oficial indisponível')}</div>`;
    stage.appendChild(head);const body=document.createElement('div');body.style.cssText='padding:18px 20px';stage.appendChild(body);
    if(cap&&cap.wav){const w=cap.wav,tms=[],amp=[],N=w.samples.length,step=Math.max(1,Math.floor(N/2400));for(let i=0;i<N;i+=step){tms.push(i/w.sampleRate*1000);amp.push(w.samples[i]);}
      hostChart(body,{name:'imp_wave',xScale:'linear',xUnit:'ms',yUnit:'',trace:cssv('--d-impulse'),height:240,series:[{name:cap.stimulus||'Forma de onda',x:tms,y:amp}]});}
    body.insertAdjacentHTML('beforeend','<div class="notice" style="margin-top:14px">'+T('Sinal externo — IR e envelope oficiais (MS-04) exigem uma medição normativa.')+'</div>');return;}

  const etc=etcToDb(envc.y),dec=schroeder(irc.x,irc.y);
  const rawR=detectPeaks(envc.x,etc,6,1).filter(p=>p.f>1.5&&p.f<50).sort((a,b)=>a.f-b.f);
  const refl=[];rawR.forEach(p=>{const last=refl[refl.length-1];if(last&&p.f-last.t<0.6){if(p.level>last.rel){last.t=p.f;last.rel=p.level;}}else refl.push({t:p.f,rel:p.level});});refl.sort((a,b)=>b.rel-a.rel);refl.splice(8);
  let tot=0;for(let i=0;i<irc.x.length;i++){if(irc.x[i]<0)continue;tot+=irc.y[i]*irc.y[i];}
  const t20=crossTime(dec.x,dec.y,-20),slope=linFitRange(dec.x,dec.y,-5,-35);
  const lat=sc('Latency_ms'),pol=sc('Polarity');
  const itdg=refl.length?Math.min(...refl.map(r=>r.t)):null;
  const t60=crossTime(dec.x,dec.y,-60);
  let eEarly=0;const bnd=itdg!=null?itdg:2;for(let i=0;i<irc.x.length;i++){const t=irc.x[i];if(t<0)continue;if(t<bnd)eEarly+=irc.y[i]*irc.y[i];}
  const directPct=tot?100*eEarly/tot:null;
  const reflSig=r=>r.rel>-9?T('forte'):r.rel>-16?T('audível'):T('sutil');
  let curRefl=null,curBand=null;
  const wmarks=[{x:0,label:T('direto')}].concat(refl.map(r=>({x:r.t,label:fmt(r.rel,0)+' dB'})));

  const ws=document.createElement('div');ws.className='ws';
  ws.innerHTML=`
    <div class="ws-verdict">
      <div class="ws-title"><div class="vt-q">${T('Como responde no tempo? Há reflexões?')}</div><div class="vt-h">${T('Resposta impulsiva')}</div></div>
      <div class="ws-answer" id="im-answer"></div>
      <div class="vtrust ${M._trust==='idle'?'warn':M._trust}" id="im-trust"><i></i></div>
    </div>

      +refl.slice(0,5).map((r,i)=>`<button class="achip nt" data-i="${refl.indexOf(r)}">▌ ${fmt(r.t,2)}ms <i>${fmt(r.rel,0)}dB</i></button>`).join('')+`</span>`;

/* ===== render ===== */
const val=e=>(e&&e.value!=null&&isFinite(e.value))?e.value:null;
function vchip(k,v,u,cls,vc){return `<div class="vchip ${cls||''}"><div class="vc-k">${k}</div><div class="vc-v ${vc||''}">${v}<i>${u||''}</i></div></div>`;}
function shorten(s){return s&&s.length>22?s.slice(0,20)+'…':(s||'—');}
/* Aquisição como evidência — por estímulo. Hoje deriva da integridade de cada captura;
   quando o Measurement Engine publicar eventos (M.events), eles são usados diretamente. */
function acquisitionFindings(){
  if(Array.isArray(M.events)&&M.events.length)return M.events.map(e=>({stage:e.stage||e.stimulus||'—',file:e.file,sev:e.severity||(e.level==='error'?'bad':e.level==='warn'?'warn':'ok'),msg:e.msg||e.message,peakDb:e.peakDb,clip:e.clip,low:e.low}));
  return (M.captures||[]).map(c=>{const q=c.wav?captureIntegrity(c.wav.samples):null;let clip=0;if(c.wav)for(const x of c.wav.samples)if(Math.abs(x)>=0.999)clip++;
    const isSil=/silence|st-?0?1/i.test((c.stimulus||'')+(c.file||''));
    const low=q?(q.peakDb<-40&&!isSil):false,sev=clip||(q&&q.peakDb>-1)?'bad':(((q&&q.peakDb>-3&&!isSil)||low)?'warn':'ok');
    return {stage:c.stimulus||shorten(c.file)||'captura',file:c.file,sev,peakDb:q?q.peakDb:null,rmsDb:q?q.rmsDb:null,clip,low,sil:isSil};});}
function findMsg(f){if(f.msg)return f.msg;if(f.sil)return T('silêncio de referência')+(f.clip?(' · clipping '+f.clip):'');
  return (f.peakDb!=null?(T('pico')+' '+fmt(f.peakDb,1)+' dBFS'):'')+(f.clip?(' · clipping '+f.clip+' '+T('amostras')):'')+(f.low?T(' · sinal baixo'):((f.clip||(f.peakDb!=null&&f.peakDb>-1))?T(' · nível elevado'):T(' · limpo')));}
/* Contexto da medição — referência silenciosa, convocável de QUALQUER instrumento, muda até ser clicada */
let CURRENT=null,DOMS=[];

/* bootSession(session) — ENTRADA CANÔNICA E ÚNICA DO LABORATÓRIO.
   A Session que chega aqui é SEMPRE produzida pelo mesmo pipeline: ingest → fromAamp → bootSession.
   Origem indistinta — arquivo .aamp salvo OU caracterização recém-finalizada (que persiste um .aamp
   e é reaberta pelo mesmo caminho). Não há fonte "ao vivo" separada; a Session é única e canônica. */
function bootSession(session){
  const _end=PDBG.mark('bootSession');
  if(session)M=session;
  M._vizCache={};
  PDBG.dumpSession(M);
  const en=document.getElementById('entry');if(en)en.classList.add('hide');
  document.getElementById('view').classList.remove('hide');

  const pc=M.captures[M.primary],wav=pc&&pc.wav;
  const q=wav?SCI.integrity(wav.samples):null;
  let clipTot=q?q.clip:0;M.captures.forEach((c,i)=>{if(i!==M.primary&&c.wav)for(const x of c.wav.samples)if(Math.abs(x)>=0.999)clipTot++;});
  const trust=(clipTot||(q&&q.peakDb>-1))?'bad':(((q&&q.peakDb>-6)||M.metrics.lowConf)?'warn':(q?'ok':'idle'));
  M._trust=trust;M._integ={q,clipTot};

  SESSION.history=[];SESSION.wfStep=0;SESSION._anomalies=null;
  DOMS=[{id:'investigation',label:T('Investigação'),q:'Existe alguma anomalia?',led:'ok',build:buildInvestigationEnv}];
  ECOSYSTEM.forEach(g=>g.items.forEach(([id,label])=>{if(BUILDERS[id])DOMS.push({id,label,led:domLed(id),build:BUILDERS[id]});}));

  buildRail();
  showDomain('integrity');
  _end();
}
function domLabel(d){return T({integrity:'Integridade',frequency:'Frequência',noise:'Ruído',imd:'Distorção',impulse:'Impulsiva'}[d]||d);}

/* varredura de anomalias — o engenheiro entra perguntando "existe algo errado?", não "qual instrumento" */
function scanAnomalies(M){const A=[],sc=k=>M.metrics.scalars[k],val=e=>(e&&e.value!=null&&isFinite(e.value))?e.value:null;
  const q=M._integ&&M._integ.q,clip=M._integ?M._integ.clipTot:0;
  if(clip)A.push({dom:'integrity',sev:'high',conf:'alta',label:T('Clipping na captura'),detail:clip+T(' amostras saturadas — caracterização comprometida')});
  if(q&&q.peakDb>-1&&!clip)A.push({dom:'integrity',sev:'high',conf:'alta',label:T('Headroom crítico'),detail:fmt(q.peakDb,1)+T(' dBFS de pico')});
  else if(q&&q.peakDb>-6&&q.peakDb<=-1)A.push({dom:'integrity',sev:'low',conf:'média',label:T('Headroom baixo'),detail:fmt(q.peakDb,1)+T(' dBFS de pico')});
  const fr=M.metrics.curves['MS-01'],ph=M.metrics.curves['MS-02'],gd=M.metrics.curves['MS-03'];
  if(fr){let y=fr.y.slice();let p=0;for(let i=1;i<y.length;i++)if(y[i]>y[p])p=i;const off=y[p];y=y.map(v=>v-off);const disp=smoothFracOct(fr.x,y,6),st=freqStats(fr.x,disp);
    detectPeaks(fr.x,disp,3,1).slice(0,3).forEach(pk=>{const co=ph&&(rangeStats(ph,pk.fL||pk.f*0.7,pk.fR||pk.f*1.4)||{}).ripple>25;
      A.push({dom:'frequency',focus:{f:pk.f},sev:pk.prom>6?'high':'med',conf:'alta',label:T('Ressonância em')+' '+fHz(pk.f),detail:'+'+pk.prom.toFixed(1)+' dB · Q '+(pk.Q?pk.Q.toFixed(2):'—')+(co?T(' · coincide em fase'):'')});});
    detectPeaks(fr.x,disp,4,-1).slice(0,2).forEach(nt=>A.push({dom:'frequency',focus:{f:nt.f},sev:nt.prom>8?'high':'med',conf:'média',label:T('Notch em')+' '+fHz(nt.f),detail:'−'+nt.prom.toFixed(1)+T(' dB · possível cancelamento')}));
    if(st.tilt!=null&&Math.abs(st.tilt)>1)A.push({dom:'frequency',sev:'low',conf:'alta',label:T('Inclinação espectral'),detail:fmt(st.tilt,2)+T(' dB/oct ao longo da banda')});
    if(st.hi3!=null&&st.hi3<15000)A.push({dom:'frequency',focus:{f:st.hi3},sev:'low',conf:'alta',label:T('Roll-off em')+' '+fHz(st.hi3),detail:T('banda útil termina em −3 dB')});}
  if(gd&&gd.y){const s=gd.y.filter(isFinite).slice().sort((a,b)=>a-b),med=s[s.length>>1],ex=gd.y.map(v=>v-med),rs=rangeStats({x:gd.x,y:ex},gd.x[0],gd.x[gd.x.length-1]);
    if(rs&&rs.ripple>1)A.push({dom:'frequency',sev:rs.ripple>3?'med':'low',conf:'média',label:T('Variação de atraso de grupo'),detail:rs.ripple.toFixed(1)+T(' ms — acima do limiar audível (~1 ms)')});}
  const imd=val(sc('IMD_pct')),thd=val(sc('THD_pct'));
  if(imd!=null&&imd>1)A.push({dom:'imd',sev:imd>3?'high':'med',conf:'alta',label:T('IMD elevada'),detail:imd.toFixed(2)+'%'});
  if(thd!=null&&thd>1)A.push({dom:'imd',sev:thd>3?'high':'med',conf:'alta',label:T('THD elevada'),detail:thd.toFixed(2)+'%'});
  const nf=val(sc('NoiseFloor_dBFS')),snr=val(sc('SNR_dB'));
  if(snr!=null&&snr<60)A.push({dom:'noise',sev:snr<40?'high':'low',conf:'alta',label:T('SNR baixo'),detail:snr.toFixed(1)+' dB'});
  if(nf!=null&&nf>-60)A.push({dom:'noise',sev:'low',conf:'alta',label:T('Piso de ruído alto'),detail:nf.toFixed(1)+' dBFS'});
  const m04=M.metrics.byId&&M.metrics.byId['MS-04'];
  if(m04){const envc=ms04Curves(m04).env;
    if(envc){const etc=etcToDb(envc.y);detectPeaks(envc.x,etc,6,1).filter(p=>p.f>1.5&&p.f<50).sort((a,b)=>b.level-a.level).slice(0,2)
      .forEach(p=>A.push({dom:'impulse',focus:{t:p.f},sev:p.level>-9?'med':'low',conf:'alta',label:T('Reflexão em')+' '+fmt(p.f,1)+' ms',detail:fmt(p.level,1)+T(' dB rel. ao direto · pente-filtro ~')+fHz(500/p.f)}));}}
  const rank={high:0,med:1,low:2};A.sort((a,b)=>rank[a.sev]-rank[b.sev]);return A;}
function sessionAnomalies(){if(!M)return [];return SESSION._anomalies||(SESSION._anomalies=scanAnomalies(M));}

/* ===== FASE 2 · serviços compartilhados da plataforma (em memória; sem persistência — DOC-00) ===== */
/* Knowledge Base — conhecimento de engenharia compartilhado por todos os instrumentos */
const KB={
  resonance:{t:'Ressonância',d:'Pico estreito onde o sistema acumula energia. Coincidindo em fase, é de fase mínima e corrigível por EQ inverso (bell invertido na mesma f e Q).'},
  notch:{t:'Notch / cancelamento',d:'Queda estreita, frequentemente por interferência. Notches periódicos indicam pente-filtro; o espaçamento Δf revela o atraso Δt ≈ 1/Δf.'},
  comb:{t:'Pente-filtro',d:'Uma reflexão atrasada Δt soma-se ao direto e cria notches em (2k−1)/(2Δt). Origem temporal — EQ não resolve; trate a reflexão.'},
  groupdelay:{t:'Atraso de grupo',d:'Atraso por frequência. Variação acima de ~1 ms é audível como smearing temporal; comum perto de crossovers e filtros allpass.'},
  itdg:{t:'ITDG',d:'Initial Time Delay Gap — intervalo entre o som direto e a 1ª reflexão; define a sensação de proximidade e o início do pente-filtro.'},
  thd:{t:'THD / harmônicos',d:'Energia em múltiplos da fundamental. Acima de ~1% indica não-linearidade audível; a assinatura par/ímpar caracteriza sua natureza.'},
  imd:{t:'IMD',d:'Produtos de soma/diferença entre tons — não-linearidade que não aparece no THD de tom único; sensível a sobrecarga.'},
  noise:{t:'Piso de ruído / SNR',d:'Definem a menor variação distinguível e a janela dinâmica útil da caracterização.'},
  headroom:{t:'Headroom',d:'Margem até o fundo de escala. Pouco headroom arrisca clipping e compromete a linearidade da medida.'},
  rolloff:{t:'Roll-off',d:'Fim da banda útil (−3 dB). Pode ser limite do sistema ou do estímulo — confirme a faixa esperada.'}};
function kb(topic){const k=KB[topic];return k?{t:T(k.t),d:T(k.d)}:null;}
function anomalyTopic(a){const l=a.label||'';if(/Ressonância|Resonance/.test(l))return 'resonance';if(/Notch/.test(l))return 'notch';if(/atraso de grupo|group delay/i.test(l))return 'groupdelay';if(/Reflexão|Reflection/.test(l))return 'comb';if(/Roll-?off/i.test(l))return 'rolloff';if(/Headroom/i.test(l))return 'headroom';if(/THD|harmôn/i.test(l))return 'thd';if(/IMD/.test(l))return 'imd';if(/ruído|SNR/i.test(l))return 'noise';return null;}

/* Correlation Engine — dado um fenômeno num domínio, encontra seus correlatos nos demais */
function correlate(ph){const out=[],phc=M.metrics.curves['MS-02'],gd=M.metrics.curves['MS-03'],m04=M.metrics.byId&&M.metrics.byId['MS-04'];
  if(ph.dom==='frequency'&&ph.f){const f=ph.f;
    if(phc){const rs=rangeStats(phc,f*0.8,f*1.25);if(rs&&rs.ripple>20)out.push({dom:'phase',label:T('Coincide em fase'),detail:fmt(rs.ripple,0)+T('° em torno de')+' '+fHz(f)+T(' — fase mínima')});}
    if(gd){const s=gd.y.filter(isFinite).slice().sort((a,b)=>a-b),med=s[s.length>>1],ex=gd.y[nearestIdx(gd.x,f)]-med;if(Math.abs(ex)>0.5)out.push({dom:'groupdelay',label:T('Pico de atraso de grupo'),detail:fmt(ex,2)+' ms de excesso em '+fHz(f)});}
    if(ph.type==='notch'&&m04){const env=ms04Curves(m04).env;if(env){const etc=etcToDb(env.y),refl=detectPeaks(env.x,etc,6,1).filter(p=>p.f>1.5&&p.f<50),dt=500/f,near=refl.sort((a,b)=>Math.abs(a.f-dt)-Math.abs(b.f-dt))[0];if(near&&Math.abs(near.f-dt)<dt*0.6)out.push({dom:'impulse',label:T('Compatível com reflexão'),detail:'reflexão em '+fmt(near.f,2)+' ms prevê este notch'});}}}
  if(ph.dom==='impulse'&&ph.t)out.push({dom:'frequency',label:T('Imprime pente-filtro'),detail:T('notches a partir de')+' '+fHz(500/ph.t)});
  return out;}

/* Recommendation Engine — opções e interpretação (evidência, não veredicto) */
function recommend(a){const l=a.label||'';
  if(a.dom==='frequency'){if(/Ressonância|Resonance/.test(l)){const f=a.focus&&a.focus.f;return {opt:T('Opção de correção'),text:T('Coincidindo em fase, é de fase mínima: um bell invertido em')+' '+(f?fHz(f):T('na frequência'))+' '+T('(mesma Q) achata o pico — confirme antes que não mascara uma reflexão.')};}
    if(/Notch/.test(l))return {opt:T('Interpretação'),text:T('Notch estreito sugere cancelamento por reflexão; EQ aditivo não resolve — investigue a origem temporal na Impulsiva.')};
    if(/atraso de grupo|group delay/i.test(l))return {opt:T('Interpretação'),text:T('Variação de GD acima de ~1 ms é audível como smearing; comum perto de crossovers/allpass — verifique alinhamento.')};
    if(/Roll-?off/i.test(l))return {opt:T('Interpretação'),text:T('Banda útil termina cedo — limite do sistema ou do estímulo; confirme a faixa esperada.')};
    if(/Inclinação|tilt/i.test(l))return {opt:T('Interpretação'),text:T('Inclinação espectral sugere balanço tonal geral; um shelf amplo equilibra sem tocar fenômenos locais.')};}
  if(a.dom==='impulse'&&/Reflexão|Reflection/.test(l)){const t=a.focus&&a.focus.t;return {opt:T('Opção de tratamento'),text:T('Reflexão')+(t?' '+T('a')+' '+fmt(t,2)+' ms':'')+' '+T('gera pente-filtro em')+' '+(t?fHz(500/t):'')+' '+T('e múltiplos — absorção/reposicionamento reduz na origem; EQ não.')};}
  if(a.dom==='integrity')return {opt:T('Ação'),text:T('Resolva a integridade antes de interpretar as demais métricas — ela condiciona toda a caracterização.')};
  if(a.dom==='imd')return {opt:T('Interpretação'),text:T('Distorção elevada indica não-linearidade; reduza o nível de excitação e reavalie para separar comportamento de sobrecarga.')};
  if(a.dom==='noise')return {opt:T('Interpretação'),text:T('Piso/SNR limitam a menor variação confiável; blindagem e ganho de entrada ampliam a janela útil.')};
  return null;}

/* Session Engine — estado da sessão em memória (sem armazenamento; reinicia a cada carga) */
const SESSION={history:[]};
function logHistory(dom,label){const h=SESSION.history,last=h[h.length-1];if(last&&last.dom===dom)return;h.push({ts:Date.now(),dom,label});if(h.length>40)h.shift();}

/* Trace Math / Derived Results — operações exibíveis em qualquer instrumento de curva */
const TM={};
function tmSmooth(cv,frac){return smoothFracOct(cv.x,cv.y,frac||6);}
function tmInvert(cv){return cv.y.map(v=>-v);}
function tmNormalize(cv){let mx=-Infinity;cv.y.forEach(v=>{if(isFinite(v)&&v>mx)mx=v;});return cv.y.map(v=>v-mx);}

/* Investigation Engine — síntese da conclusão a partir das evidências marshaladas */
function synthesizeConclusion(an,trust){const tl=trust==='bad'?T('comprometida'):trust==='warn'?T('confiável com ressalvas'):trust==='idle'?T('externa (sem normativa)'):T('confiável');
  if(!an.length)return T('Caracterização')+' '+tl+'. '+T('Nenhuma anomalia acima do limiar — comportamento dentro do esperado.');
  const d=an[0];let s=T('Caracterização')+' '+tl+'. '+T('Anomalia dominante:')+' '+d.label.toLowerCase()+' ('+d.detail.split('·')[0].trim()+').';
  const others=an.slice(1,3).map(a=>a.label.toLowerCase());if(others.length)s+=' '+T('Também:')+' '+others.join('; ')+'.';
  const r=recommend(d);if(r)s+=' '+r.text;return s;}

/* Workflow Engine — revisão guiada de ponta a ponta */
function workflowSteps(an){const steps=[{k:'trust',label:'1 · '+T('Confiança'),dom:'integrity'},{k:'scan',label:'2 · '+T('Anomalias'),dom:'investigation'}];
  an.slice(0,4).forEach((a,i)=>steps.push({k:'inv'+i,label:(3+i)+' · '+a.label,dom:a.dom,focus:a.focus}));
  steps.push({k:'concl',label:(3+Math.min(an.length,4))+' · '+T('Conclusão'),dom:'investigation',concl:true});return steps;}

      const rec=recommend(a),topic=anomalyTopic(a),k=topic?kb(topic):null;
