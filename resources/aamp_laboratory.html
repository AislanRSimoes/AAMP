<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAMP Laboratory — Gen-3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Roboto+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   AAMP Laboratory — Folha de estilo canônica (consolidação Gen-3)
   Linguagem: instrumento de bancada — chassi de alumínio anodizado
   grafite · displays de vidro preto embutido · teclas usinadas ·
   LEDs planos (luz do material, não halo).
   CONTRATO: transparência nunca sobre a área de dados; representação
   científica intocada; toda cor comunica estado ou domínio.
   ═══════════════════════════════════════════════════════════════════ */

:root{
  /* — chassi e superfícies — */
  --chassis:#06090C;         /* fundo do equipamento */
  --alu:#0D1117;             /* alumínio anodizado (bar, rail, painéis) */
  --alu-hi:#141B22;          /* tecla em repouso (topo) */
  --alu-lo:#0D131A;          /* tecla em repouso (base) */
  --glass:#050607;           /* vidro preto dos displays */
  --seam:#04070A;            /* junta usinada */
  --edge:rgba(255,255,255,.05); /* aresta de luz */
  --bezel:#1A242C;--bezel2:#222F39;
  --panel:#0E141A;--inset:#0A0F14;--screen:#0A0F13;--grat:#16212A;
  /* — texto — */
  --txt:#E6ECF2;--txt2:#8A9BA6;--txt3:#66757F;--txt3r:#7A8A96; /* txt3r: labels legíveis */
  /* — domínios (identidade) — */
  --d-integrity:#2ECC71;--d-frequency:#2977E7;--d-harmonics:#9B6CFF;
  --d-temporal:#FF8A3D;--d-imd:#36D6D6;--d-noise:#8A9BA6;--d-impulse:#E85D75;
  /* — estados (exclusivos de estado; nunca reutilizados como domínio) — */
  --ok:#2ECC71;--warn:#FFB020;--bad:#FF5252;
  /* — geometria — */
  --r:6px;         /* painéis e displays */
  --r-ctl:4px;     /* teclas e controles */
  /* — movimento — */
  --t:150ms;--t-slow:220ms;
  /* — tipografia: 3 famílias, 9 tamanhos, 3 trackings — */
  --fident:'Space Grotesk',system-ui,'Segoe UI',sans-serif;
  --fbody:'Inter',system-ui,Roboto,sans-serif;
  --fmono:'Roboto Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --fs-0:8.5px;--fs-1:10px;--fs-2:11.5px;--fs-3:13px;--fs-4:15px;
  --fs-5:18px;--fs-6:21px;--fs-7:25px;
  --ls-lab:.085em;--ls-tight:-.015em;
}

/* ── base ─────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--fbody);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
  background:radial-gradient(1500px 760px at 50% -22%,#10161C,transparent 60%),var(--chassis)}
b,strong{font-weight:600}
input[type=file]{display:none}
.hide{display:none}

/* voz do instrumento: toda medição é mono, tabular */
.m,.m-freq,.m-time,.m-gain,.m-q{font-family:var(--fmono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:0;font-weight:500}
.m-gain{font-weight:700}
.m-q{color:var(--txt3)}
/* labels em caixa alta: uma única gramática */
.side-cap,.vc-k,.ak,.ro-lab,.band-lab,.auto-lab,.rail-sec,.guide-lab,.gauge-lab,.meter-lab,
.chain-cap,.an-impact,.rail-trust .tt,.acq-eyebrow,.hwc-eyebrow,.ws-tools .tg,.vt-q{
  font-family:var(--fbody);font-weight:500;font-size:var(--fs-0);letter-spacing:var(--ls-lab);text-transform:uppercase;color:var(--txt3r)}

/* ── barra superior: tampa metálica ───────────────────────────────── */
.bar{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:200;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 34%),var(--alu);
  border-bottom:1px solid var(--seam);
  box-shadow:inset 0 1px 0 var(--edge),0 1px 0 var(--seam),0 14px 30px -22px #000}
.bar::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08) 22%,rgba(255,255,255,.08) 78%,transparent)}
.brand{display:flex;align-items:center;gap:13px;padding-right:19px;border-right:1px solid var(--edge)}
.brand .nm{font-family:var(--fident);font-weight:600;font-size:17px;letter-spacing:.04em}
.brand .sub{font-family:var(--fmono);font-size:9.5px;color:var(--txt3);letter-spacing:.18em;margin-top:-1px}
.bar-r{display:flex;align-items:center;gap:12px}


/* ── teclas usinadas ──────────────────────────────────────────────── */
.btn,.btn-sm,.fsel{font-family:var(--fbody);color:var(--txt);cursor:pointer;border-radius:var(--r-ctl);
  background:linear-gradient(180deg,var(--alu-hi),var(--alu-lo));border:1px solid #05090D;
  box-shadow:inset 0 1px 0 var(--edge),0 1px 2px rgba(0,0,0,.4);transition:background var(--t),color var(--t),border-color var(--t)}
.btn{font-weight:500;font-size:12px;padding:8px 14px}
.btn-sm{font-family:var(--fmono);font-size:var(--fs-1);color:var(--txt2);padding:6px 11px}
.fsel{font-family:var(--fmono);font-size:var(--fs-2);padding:6px 9px}
.btn:hover,.btn-sm:hover,.fsel:hover{background:linear-gradient(180deg,#182029,#101720);color:var(--txt)}
.btn:active,.btn-sm:active{box-shadow:inset 0 2px 5px rgba(0,0,0,.6);transform:translateY(.5px)}
.btn:focus-visible,.fsel:focus-visible,.btn-sm:focus-visible{outline:2px solid var(--d-frequency);outline-offset:2px}
.btn-sm.on{color:var(--c,var(--d-frequency));border-color:color-mix(in srgb,var(--c,var(--d-frequency)) 55%,#05090D);
  background:linear-gradient(180deg,#0A0F14,#080C11);box-shadow:inset 0 2px 5px rgba(0,0,0,.55)}
.btn-primary{background:linear-gradient(180deg,#2E86F5,#1A63D8);border:1px solid #0F52C4;color:#EAF3FF;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.4)}
.btn-primary:hover{filter:brightness(1.08)}
/* ação textual */
.talk-act,.lnk{background:none;border:none;color:var(--c,var(--d-frequency));font-family:var(--fmono);cursor:pointer;padding:0;transition:border-color var(--t)}
.talk-act{font-size:var(--fs-2);border-bottom:1px solid color-mix(in srgb,var(--c,var(--d-frequency)) 42%,transparent);white-space:nowrap}
.talk-act:hover{border-bottom-color:var(--c,var(--d-frequency))}
.lnk{font-size:var(--fs-1);margin-left:6px}
.lnk:hover{text-decoration:underline}

/* ── shell do instrumento ─────────────────────────────────────────── */
#view{display:grid;grid-template-columns:252px 1fr;height:calc(100vh - 62px)}
#view.hide{display:none}
#view.rail-collapsed{grid-template-columns:0 1fr}
#view.rail-collapsed>#rail{width:0;min-width:0;padding:0;border-right:none;overflow:hidden;opacity:0;pointer-events:none}
#view.rail-collapsed #rail-toggle{left:0}
#view.rail-collapsed #rail-toggle .ic{transform:rotate(180deg)}

#stage{position:relative;overflow:hidden;background:
  radial-gradient(120% 80% at 0% 0%,color-mix(in srgb,var(--c,var(--d-frequency)) 7%,transparent),transparent 55%),
  linear-gradient(180deg,#0A0F14,#080B0E)}
#stage.scroll{overflow-y:auto}
#stage .mod{margin:16px;scroll-margin-top:0}

/* ── rail: painel de funções (alumínio, segmentos conectados) ─────── */
#rail{display:flex;flex-direction:column;overflow-y:auto;padding:15px 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 40%),var(--alu);
  border-right:1px solid var(--seam);box-shadow:inset -1px 0 0 rgba(255,255,255,.03)}
.rail-sec{margin:2px 4px 9px}
.rail-sec.dim{opacity:.4}
.rail-trust{display:flex;align-items:center;gap:11px;background:var(--glass);border:1px solid var(--seam);border-radius:var(--r);
  padding:11px 13px;margin-bottom:16px;cursor:pointer;transition:border-color var(--t)}
.rail-trust:hover{border-color:var(--bezel2)}
.rail-trust .tl{width:10px;height:10px;border-radius:50%;flex:none;background:var(--txt3);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.rail-trust.ok .tl{background:var(--ok)}
.rail-trust.warn .tl{background:var(--warn)}
.rail-trust.bad .tl{background:var(--bad)}
.rail-trust .tt{font-size:8px}
.rail-trust .tv{font-family:var(--fbody);font-size:var(--fs-3);color:var(--txt);font-weight:600;margin-top:1px}

.rail-doms{display:flex;flex-direction:column;gap:0;flex:1}
.rail-grp{position:relative;margin:0 3px;border-radius:7px;border-top:1px solid #0E151B}
.rail-grp:first-child{border-top:none}
.rg-head{display:flex;align-items:center;gap:10px;font-family:var(--fmono);font-size:9px;letter-spacing:var(--ls-lab);text-transform:uppercase;
  color:var(--txt2);padding:10px 8px 9px;cursor:pointer;transition:color var(--t)}
.rg-head:hover{color:var(--txt)}
.rg-head .rg-ic{width:15px;text-align:center;color:var(--c,var(--d-frequency));font-size:12px;opacity:.85}
.rg-head .rg-cv{margin-left:auto;color:var(--txt3);font-size:8px;transition:transform var(--t)}
.rail-grp.open .rg-head{color:var(--txt)}
.rail-grp.open .rg-head .rg-ic{opacity:1}
.rail-grp.open .rg-head .rg-cv{transform:rotate(90deg);color:var(--c,var(--d-frequency))}
.rg-body{display:none}
.rail-grp.open .rg-body{display:block;border:1px solid #070C11;border-radius:9px;overflow:hidden;margin:3px 3px 6px;
  background:linear-gradient(180deg,#141B23,#0E141B);box-shadow:inset 0 1px 0 var(--edge),0 1px 3px rgba(0,0,0,.5)}

.rdom{--c:var(--txt3);position:relative;display:flex;align-items:center;gap:10px;cursor:pointer;overflow:hidden;
  border:none;border-radius:0;margin:0;box-shadow:none;background:transparent;padding:10px 13px;
  transition:background var(--t)}
.rg-body .rdom+.rdom{border-top:1px solid var(--edge)}
.rdom:hover{background:rgba(255,255,255,.022)}
.rdom.on{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 13%,transparent),transparent 62%);box-shadow:inset 2px 0 0 var(--c)}
.rdom .rd-nm{font-family:var(--fbody);font-size:12.5px;font-weight:500;color:var(--txt2);flex:1}
.rdom.on .rd-nm{color:var(--txt)}
.rdom .rd-dot{display:none}
.rail-entry{background:linear-gradient(180deg,#151C24,#0F151B)}
.rail-entry .rd-nm{font-weight:600;letter-spacing:.01em}
.rail-entry.on{box-shadow:inset 0 2px 6px rgba(0,0,0,.55),inset 3px 0 0 var(--d-frequency)}

.rail-meta{margin-top:14px;border-top:1px solid var(--seam);padding-top:12px;display:flex;flex-direction:column;gap:7px}
.rail-meta .rm{display:flex;justify-content:space-between;gap:10px;font-family:var(--fmono);font-size:var(--fs-1)}
.rail-meta .rm .k{color:var(--txt3);letter-spacing:.05em}
.rail-meta .rm .v{color:var(--txt2);text-align:right}

.rail-locked{opacity:.4;filter:grayscale(.5);pointer-events:none}
.rail-char{--c:var(--d-frequency)}
.rail-char .rg-body{max-height:none;overflow:visible}
.rail-char .rd-nm{color:var(--txt);font-weight:500}
.rail-char .rdom{cursor:pointer}

#rail-toggle{position:fixed;top:50%;left:252px;transform:translateY(-50%);z-index:46;width:15px;height:52px;border-radius:0 9px 9px 0;
  background:linear-gradient(180deg,var(--alu-hi),var(--alu-lo));border:1px solid #05090D;border-left:none;color:var(--txt3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--edge),0 8px 22px -12px #000;
  transition:left var(--t-slow) ease,background var(--t),color var(--t)}
#rail-toggle:hover{background:linear-gradient(180deg,#182029,#101720);color:var(--txt)}
#rail-toggle .ic{font-size:11px;transition:transform var(--t-slow)}

/* ── workspace do instrumento ─────────────────────────────────────── */
.ws{display:grid;grid-template-columns:1fr clamp(264px,24vw,318px);grid-template-rows:auto 1fr;height:100%}

/* banda de veredito: pergunta · instrumento · KPIs · confiança */
.ws-verdict{grid-column:1/3;display:flex;align-items:center;gap:20px;padding:11px 22px;border-bottom:1px solid var(--seam);
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 44%),
             linear-gradient(180deg,color-mix(in srgb,var(--c,var(--d-frequency)) 8%,var(--alu)),#080B0F);
  box-shadow:inset 0 1px 0 var(--edge),0 2px 0 var(--seam)}
.ws-title{display:flex;flex-direction:column;gap:3px;min-width:188px;padding-right:26px}
.ws-title .vt-q{color:var(--txt3);font-size:9px}
.ws-title .vt-h{font-family:var(--fident);font-size:var(--fs-7);font-weight:600;line-height:1.03;color:var(--txt);
  letter-spacing:var(--ls-tight);display:flex;align-items:center;gap:10px}
.ws-title .vt-h::before{content:"";width:5px;height:19px;border-radius:2px;flex:none;
  background:color-mix(in srgb,var(--c,var(--d-frequency)) 76%,var(--alu))}
.ws-answer{display:flex;flex-wrap:wrap;gap:0;flex:1}
.vchip{display:flex;flex-direction:column;gap:3px;padding:2px 24px 2px 0;min-width:56px;transition:color var(--t)}
.vchip .vc-k{font-size:8px}
.vchip .vc-v{font-family:var(--fmono);font-size:var(--fs-4);color:var(--txt);font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.vchip .vc-v i{font-style:normal;font-size:9px;color:var(--txt3);margin-left:2px}
.vchip .vc-v.m-freq{letter-spacing:.05em}
.vchip .vc-v.m-time{letter-spacing:-.03em}
.vchip .vc-v.m-gain{font-weight:700}
.vchip.flag .vc-v{color:var(--c,var(--d-frequency))}

/* cápsula de confiança: LED plano usinado */
.vtrust{display:flex;align-items:center;gap:8px;font-family:var(--fmono);font-size:var(--fs-2);font-weight:500;padding:9px 14px;
  border-radius:var(--r);white-space:nowrap;color:var(--txt2);
  background:linear-gradient(180deg,#10161C,#0A0E12);border:1px solid #05090D;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 1px 2px rgba(0,0,0,.4)}
.vtrust i{display:none}
.vtrust::before{content:"";width:7px;height:7px;border-radius:50%;flex:none;background:var(--txt3);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.vtrust.ok::before{background:var(--ok)}
.vtrust.warn::before{background:var(--warn)}
.vtrust.bad::before{background:var(--bad)}
.vtrust.ok{color:color-mix(in srgb,var(--ok) 62%,var(--txt))}
.vtrust.warn{color:color-mix(in srgb,var(--warn) 66%,var(--txt))}
.vtrust.bad{color:color-mix(in srgb,var(--bad) 66%,var(--txt))}

/* área principal: o display domina */
.ws-main{grid-column:1;grid-row:2;display:flex;flex-direction:column;min-height:0;padding:9px 11px 11px}
.ws-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:3px 2px;margin-bottom:5px;opacity:.55;transition:opacity var(--t)}
.ws-tools:hover,.ws-tools:focus-within{opacity:1}
.ws-tools .tg{font-family:var(--fmono)}
.ws-chart{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--glass);border:none;border-radius:7px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px #03060A,inset 0 3px 14px rgba(0,0,0,.8),inset 0 0 52px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.04)}
.ws-lane{margin-top:7px;background:var(--glass);border:none;border-radius:7px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px #03060A,inset 0 3px 14px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.04)}
.ws-chart::after,.ws-lane::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:7px;
  background:linear-gradient(157deg,rgba(255,255,255,.028),rgba(255,255,255,0) 18%)}

/* coluna de investigação: chassi lateral, blocos separados por junta */
.ws-side{grid-column:2;grid-row:2;overflow-y:auto;padding:0;display:flex;flex-direction:column;gap:0;
  border-left:1px solid var(--edge);background:var(--inset);
  box-shadow:inset 12px 0 30px -24px rgba(0,0,0,.8),-1px 0 0 var(--seam)}
.ws-side .screen{background:transparent;border:none;border-radius:0;border-bottom:1px solid #0E151B;padding:14px 16px;margin:0;box-shadow:none}
.side-cap{margin-bottom:13px;margin-top:20px;display:block}
.ws-side .side-cap:first-child,.ws-side>.screen>.side-cap:first-child{margin-top:0}
.side-cap b{color:var(--c,var(--d-frequency));font-weight:600;letter-spacing:0;text-transform:none}

/* ── LabChart: display de vidro (moldura mínima, dado protagonista) ─ */
.lc{position:relative;border:none;background:transparent;border-radius:7px;overflow:hidden}
.lc canvas{display:block;width:100%;cursor:crosshair}
.lc-tools{display:flex;align-items:center;gap:7px;padding:8px 12px 7px;background:transparent;border-bottom:1px solid #0C141C}
.lc-legend{display:flex;gap:12px;flex-wrap:wrap;flex:1}
.lc-leg{display:flex;align-items:center;gap:6px;font-family:var(--fmono);font-size:var(--fs-1);color:var(--txt3);cursor:pointer;user-select:none;
  opacity:.6;transition:opacity var(--t)}
.lc:hover .lc-leg,.lc:focus-within .lc-leg{opacity:1}
.lc-leg.off{opacity:.3}
.lc-leg .sw{width:14px;height:2px;border-radius:2px}
.lc-btn{font-family:var(--fmono);font-size:var(--fs-1);letter-spacing:.05em;color:var(--txt3);background:none;border:none;border-radius:var(--r-ctl);
  padding:4px 7px;cursor:pointer;opacity:.55;transition:opacity var(--t),background var(--t),color var(--t)}
.lc:hover .lc-btn,.lc:focus-within .lc-btn{opacity:1}
.lc-btn:hover{background:color-mix(in srgb,var(--c,var(--d-frequency)) 13%,transparent);color:var(--txt)}
/* displays de leitura sobre o vidro: sempre opacos (contrato: nada translúcido sobre dados) */
.lc-tip{position:absolute;pointer-events:none;background:rgba(6,9,12,.97);border:1px solid var(--bezel2);border-radius:5px;padding:8px 10px;
  font-family:var(--fmono);font-size:var(--fs-2);color:var(--txt);z-index:5;display:none;white-space:nowrap;box-shadow:0 10px 26px rgba(0,0,0,.6)}
.lc-tip .tx{color:#EAF2F7;font-weight:500;margin-bottom:4px}
.lc-tip .row{display:flex;align-items:center;gap:7px;color:var(--txt2)}
.lc-tip .row .sw{width:8px;height:8px;border-radius:2px}
.lc-dock{position:absolute;top:46px;right:8px;background:rgba(6,9,12,.97);border:1px solid var(--bezel2);border-radius:5px;padding:7px 10px;
  font-family:var(--fmono);font-size:10.5px;color:var(--txt2);z-index:4;display:none;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.lc-dock.on{display:block}
.lc-dock .dl{display:flex;gap:14px;justify-content:space-between;line-height:1.7;white-space:nowrap}
.lc-dock .dl b{color:var(--txt);font-weight:500}
.lc-dock .dl .cm{color:#E6F0F7;min-width:18px}
.lc-dock .dd{border-top:1px solid var(--bezel);margin-top:4px;padding-top:4px}
.lc-hint{display:none} /* atalhos nunca sobre a área de dados */

/* ── displays e leituras ──────────────────────────────────────────── */
.screen{background:var(--screen);border:1px solid var(--seam);border-radius:var(--r);padding:14px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.02),inset 0 1px 12px rgba(0,0,0,.4)}
.screen + .screen{margin-top:14px}
.r{display:flex;gap:14px;flex-wrap:wrap}
.grow{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px}

/* readouts: display flutuante, sem retângulos */
.ros{display:flex;flex-wrap:wrap;gap:14px 26px}
.ro{flex:0 1 auto;min-width:72px;padding:0;background:none;border:none}
.ro-lab{font-size:var(--fs-0);letter-spacing:.12em}
.ro-val{font-family:var(--fmono);font-size:var(--fs-5);font-weight:500;color:var(--txt);font-variant-numeric:tabular-nums;margin-top:3px;
  line-height:1.16;white-space:normal;overflow-wrap:anywhere}
.ro-val i{font-style:normal;font-size:var(--fs-1);color:var(--txt3);margin-left:4px}
.ro-val.lc-flag{color:var(--warn)}
.ws-side .ro{padding:2px 0 0}
.ws-side .ro-val{font-size:20px}
.ws-side .ro-lab{font-size:8px}

/* lâmpadas de status: LED plano */
.lamps{display:flex;flex-wrap:wrap;gap:18px}
.lamp{display:flex;align-items:center;gap:9px;font-family:var(--fmono);font-size:var(--fs-2);letter-spacing:.06em;color:var(--txt2)}
.lamp i{width:11px;height:11px;border-radius:50%;flex:none;background:var(--txt3);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.lamp.ok i{background:var(--ok)}
.lamp.warn i{background:var(--warn)}
.lamp.bad i{background:var(--bad)}

/* medidor linear */
.meter+.meter{margin-top:16px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.meter-read{font-family:var(--fmono);font-size:19px;font-weight:500;color:var(--txt);font-variant-numeric:tabular-nums}
.meter-read i{font-style:normal;font-size:var(--fs-1);color:var(--txt3);margin-left:4px}
.meter-track{position:relative;height:16px;background:var(--glass);border-radius:3px;overflow:hidden;border:1px solid var(--seam);margin-bottom:14px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.meter-track .mz{position:absolute;top:0;bottom:0}
.meter-fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:2px;transition:width .35s cubic-bezier(.2,.7,.2,1)}
.mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--txt)}
.mt{position:absolute;top:0;bottom:0;width:1px;background:rgba(127,166,188,.16)}
.mtl{position:absolute;top:18px;font-family:var(--fmono);font-size:var(--fs-0);color:var(--txt3);transform:translateX(-50%)}

/* gauge de arco */
.gauge{position:relative;width:150px;height:118px;flex:none}
.gauge svg{width:150px;height:150px;position:absolute;top:-6px;left:0}
.gauge .g-track{fill:none;stroke:var(--grat);stroke-width:9;stroke-linecap:round}
.gauge .g-val{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .5s ease}
.gauge-center{position:absolute;top:38px;left:0;right:0;text-align:center}
.gauge-val{font-family:var(--fmono);font-size:20px;font-weight:500;color:var(--txt);font-variant-numeric:tabular-nums;line-height:1}
.gauge-val i{font-style:normal;font-size:var(--fs-1);color:var(--txt3);margin-left:3px}
.gauge-lab{margin-top:6px}

/* barras espectrais */
.bands{display:flex;gap:8px;align-items:flex-end}
.band{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.band-track{width:100%;height:92px;background:var(--glass);border:1px solid #11181F;border-radius:3px;display:flex;align-items:flex-end;overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.band-fill{width:100%;background:var(--c,var(--d-frequency));border-radius:0 0 2px 2px;transition:height .35s}
.band-val{font-family:var(--fmono);font-size:var(--fs-2);color:var(--txt);font-variant-numeric:tabular-nums}
.band-lab{font-size:9px;letter-spacing:.03em;text-align:center}

/* ── módulos de domínio (Engineering View) ────────────────────────── */
.mod{position:relative;background:linear-gradient(180deg,var(--panel),#0B0F13);border:1px solid var(--bezel);border-radius:var(--r);
  margin-bottom:24px;overflow:hidden;scroll-margin-top:135px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 18px 40px -28px #000}
.mod-rail{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--d-frequency))}
.mod-head{position:relative;display:flex;align-items:center;gap:14px;padding:15px 18px 13px 20px;border-bottom:1px solid var(--seam)}
.mod-idx{font-family:var(--fmono);font-size:var(--fs-2);font-weight:500;color:var(--c,var(--d-frequency));
  border:1px solid var(--c,var(--d-frequency));border-radius:var(--r-ctl);padding:2px 7px;letter-spacing:var(--ls-lab)}
.mod-head h2{font-family:var(--fident);font-weight:600;font-size:19px;color:var(--c,var(--d-frequency));letter-spacing:.01em}
.mod-q{font-family:var(--fmono);font-size:var(--fs-2);color:var(--txt2);margin-left:auto;text-align:right;letter-spacing:.02em}
.mod-led{width:9px;height:9px;border-radius:50%;flex:none;margin-left:4px;background:var(--txt3);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.mod-led.ok{background:var(--ok)}
.mod-led.warn{background:var(--warn)}
.mod-led.bad{background:var(--bad)}
.mod-body{padding:16px 18px 18px}

/* ── tabelas e cadeias ────────────────────────────────────────────── */
.log{font-family:var(--fmono);font-size:var(--fs-2);width:100%;border-collapse:collapse}
.log td{padding:6px 10px;border-bottom:1px solid #11181F}
.log td:first-child{color:var(--txt2)}
.log td:last-child{text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}
.chain{display:flex;flex-direction:column;gap:5px}
.chain-cap{margin-bottom:11px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--fs-1)}
.chain-cap .eng{font-family:var(--fmono);font-weight:400;font-size:9.5px;color:var(--txt3);letter-spacing:.03em;text-transform:none}
.chain-row{display:flex;align-items:center;gap:11px;padding:7px 11px;background:#0B1116;border:1px solid #11181F;
  border-left:2px solid var(--ok);border-radius:3px}
.chain-row i{font-style:normal;color:var(--ok);font-size:12px;min-width:12px;text-align:center}
.chain-row.fail{border-left-color:var(--bad)}
.chain-row.fail i{color:var(--bad)}
.chain-row .cs{flex:1;font-family:var(--fmono);font-size:var(--fs-2);color:var(--txt)}
.chain-row .cv{font-family:var(--fmono);font-size:10.5px;color:var(--txt2);text-align:right}
.notice{font-family:var(--fmono);font-size:12px;color:var(--txt2);background:color-mix(in srgb,var(--warn) 6%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--r);padding:12px 14px}

/* ── desvios selecionáveis ────────────────────────────────────────── */
.feat{display:flex;align-items:center;gap:12px;padding:8px 11px;border:1px solid #11181F;border-radius:5px;background:#0B1116;cursor:pointer;
  transition:background var(--t),border-color var(--t);margin-bottom:6px}
.feat:last-child{margin-bottom:0}
.feat:hover{border-color:var(--c,var(--d-frequency));background:color-mix(in srgb,var(--c,var(--d-frequency)) 8%,transparent)}
.feat.on{border-color:var(--c,var(--d-frequency));background:color-mix(in srgb,var(--c,var(--d-frequency)) 14%,transparent);
  box-shadow:inset 2px 0 0 var(--c,var(--d-frequency))}
.feat-ic{font-size:12px;width:16px;text-align:center;flex:none;transition:color var(--t)}
.feat-ic.pk{color:var(--c,var(--d-frequency))}
.feat-ic.nt{color:#7FA6BC}
.feat-ic.sl{color:var(--warn)}
.feat-f{font-family:var(--fmono);font-size:12px;color:var(--txt);min-width:78px}
.feat-m{font-family:var(--fmono);font-size:var(--fs-2);color:var(--txt2);margin-left:auto;text-align:right}
.feat-empty{font-family:var(--fmono);font-size:var(--fs-2);color:var(--txt3);padding:6px 2px}

/* investigação automática */
.fq-auto{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:none;border:none;padding:1px 0 6px;color:var(--txt3)}
.auto-lab{color:var(--c,var(--d-frequency))}
.auto-sum{font-family:var(--fbody);font-size:12.5px;color:var(--txt)}
.auto-chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.achip{font-family:var(--fmono);font-size:var(--fs-2);color:var(--txt);background:#10171E;border:1px solid var(--bezel);border-radius:var(--r-ctl);
  padding:5px 9px;cursor:pointer;transition:border-color var(--t);white-space:nowrap}
.achip i{font-style:normal;color:var(--txt3);margin-left:4px}
.achip:hover{border-color:var(--c,var(--d-frequency))}
.achip.pk{box-shadow:inset 2px 0 0 var(--ok)}
.achip.nt{box-shadow:inset 2px 0 0 var(--bad)}
#fq-conf,#fq-tonal{opacity:.7;transition:opacity var(--t)}
#fq-conf:hover,#fq-tonal:hover{opacity:1}

/* cartão do fenômeno */
.phen-nat{font-family:var(--fbody);font-size:var(--fs-2);color:var(--txt2);margin-top:10px;padding-top:10px;border-top:1px solid var(--seam);line-height:1.45}
.phen-co{font-family:var(--fmono);font-size:10.5px;color:var(--txt3);margin-top:7px}
.phen-co b{color:var(--c,var(--d-frequency))}

/* ── painel de investigação: fluxo encadeado ──────────────────────── */
.flow{display:flex;flex-direction:column;align-items:flex-start;padding:4px 0}
.fnode{font-family:var(--fmono);font-size:12.5px;color:var(--txt2);line-height:1.42;letter-spacing:.01em;padding:5px 0}
.fnode .fk{color:var(--txt);font-weight:600}
.fnode.ok .fk{color:var(--ok)}
.fnode.head{font-family:var(--fident);font-size:var(--fs-6);font-weight:600;color:var(--c,var(--d-frequency));
  letter-spacing:var(--ls-tight);line-height:1.1;padding-bottom:5px}
.fnode.head .fhz{font-family:var(--fmono);font-size:var(--fs-3);color:var(--txt2);font-weight:400;margin-left:8px}
.fnode.mag{font-family:var(--fmono);font-size:19px;color:var(--txt);line-height:1.15;font-weight:500}
.fnode.mag .m-gain{font-weight:700}
.fnode.mag .m-q{font-size:var(--fs-4)}
.fnode.mag .sig{font-family:var(--fbody);font-size:12.5px;font-weight:400;color:var(--txt3);margin-left:7px;letter-spacing:0}
.fnode.concept{font-family:var(--fbody);font-size:16px;font-weight:500;color:var(--txt2);line-height:1.3;letter-spacing:0}
.fnode.concept .lead{font-family:var(--fbody);font-size:var(--fs-2);font-weight:500;color:var(--txt3);letter-spacing:0;text-transform:none;margin-right:5px}
.fnode.verdict{font-family:var(--fbody);font-size:var(--fs-5);font-weight:600;color:var(--txt);line-height:1.2;letter-spacing:0}
.fnode.verdict.ok{color:var(--ok)}
.fnode.suggest{font-family:var(--fmono);font-size:19px;color:var(--txt);line-height:1.2}
.fnode.suggest .m-q{font-size:14px}
.fnode.act{font-family:var(--fbody);font-size:14px;font-weight:400;color:var(--txt2);line-height:1.35;letter-spacing:0}
.farr{color:var(--c,var(--d-frequency));opacity:.34;font-size:12px;line-height:1;padding:6px 0 6px 3px}
.fnext{margin-top:20px;padding-top:14px;border-top:1px solid #0E151B;font-family:var(--fbody);font-size:var(--fs-3);color:var(--txt3);letter-spacing:0}
.fnext b{font-family:var(--fmono);color:var(--txt2);font-weight:500}
.flow .talk-act{margin-left:5px}
.flow-empty{font-family:var(--fbody);font-size:13.5px;color:var(--txt3);line-height:1.65}

/* conversa contínua */
.talk{font-family:var(--fbody);font-size:14.5px;line-height:1.74;color:var(--txt2)}
.talk p{margin:0 0 15px;line-height:1.62}
.talk p:last-child{margin-bottom:0}
.talk b{color:var(--txt);font-weight:600}

/* diagnóstico principal */
.dx{margin:2px 0 26px}
.dx-main{font-family:var(--fident);font-size:var(--fs-6);font-weight:600;color:var(--c,var(--d-frequency));line-height:1.25;letter-spacing:var(--ls-tight)}
.dx-at{font-family:var(--fmono);font-size:14px;color:var(--txt2);font-weight:400;margin-left:6px}
.dx-detail{font-family:var(--fbody);font-size:14.5px;color:var(--txt);line-height:1.62;margin-top:10px;max-width:700px;letter-spacing:0}
.dx-sub{font-family:var(--fbody);font-size:12.5px;color:var(--txt3);margin-top:12px;line-height:1.7;max-width:700px;letter-spacing:0}

/* assistente de investigação (narrativa) */
.asst{display:flex;flex-direction:column}
.asst .arow{padding:11px 0;border-bottom:1px solid #0E151B}
.asst .arow:first-child{padding-top:2px}
.asst .arow:last-child{border-bottom:none}
.asst .ak{margin-bottom:5px;display:block}
.asst .av{font-family:var(--fbody);font-size:var(--fs-5);font-weight:600;color:var(--txt);line-height:1.16}
.asst .av small{font-family:var(--fmono);font-size:12px;font-weight:400;color:var(--txt2);letter-spacing:0}
/* condutor: o ambiente propõe o próximo passo */
.arow.cond{border-top:1px solid color-mix(in srgb,var(--c,var(--d-frequency)) 28%,#0E151B);border-bottom:none;margin-top:4px;padding-top:13px}
.arow.cond .ak{color:var(--c,var(--d-frequency))}
.cond-line{font-family:var(--fbody);font-size:var(--fs-3);color:var(--txt);line-height:1.5;margin:2px 0 10px}
.cond-next{margin-top:11px;font-family:var(--fmono);font-size:10.5px;color:var(--txt3);letter-spacing:.02em}
.cond-next b{color:var(--txt2);font-weight:500}

/* ── cockpit de anomalias ─────────────────────────────────────────── */
.invhl{font-family:var(--fbody);font-size:16px;font-weight:600;padding:7px 15px;border-radius:7px;border:1px solid;letter-spacing:0}
.invhl.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.invhl.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.invhl.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.anlist{display:flex;flex-direction:column;gap:8px}
.ancard{display:flex;align-items:stretch;gap:0;background:var(--screen);border:1px solid var(--seam);border-left:3px solid var(--c,var(--d-frequency));
  border-radius:7px;padding:0;cursor:pointer;overflow:hidden;transition:border-color var(--t)}
.ancard:hover{border-color:var(--c,var(--d-frequency))}
.an-rank{display:flex;align-items:center;justify-content:center;min-width:44px;font-family:var(--fmono);font-size:20px;font-weight:500;
  color:var(--txt3);border-right:1px solid #0E151B;background:var(--inset);transition:color var(--t)}
.ancard:hover .an-rank{color:var(--c,var(--d-frequency))}
.an-body{flex:1;padding:13px 17px;display:flex;flex-direction:column;gap:8px;min-width:0}
.an-head{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.an-phen{font-family:var(--fident);font-size:17px;font-weight:600;color:var(--txt);letter-spacing:-.01em}
.an-where{font-family:var(--fmono);font-size:var(--fs-3);color:var(--c,var(--d-frequency));font-weight:500}
.an-impact{margin-left:auto;font-size:var(--fs-0);padding:3px 9px;border-radius:var(--r-ctl);border:1px solid;align-self:center}
.an-impact.high{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.an-impact.med{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.an-impact.low{color:var(--txt2);border-color:var(--bezel)}
.an-sev{width:9px;height:9px;border-radius:50%;flex:none;align-self:center;margin-left:12px;background:var(--txt3);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.an-sev.high{background:var(--bad)}
.an-sev.med{background:var(--warn)}
.an-detail{font-family:var(--fbody);font-size:12.5px;color:var(--txt2);line-height:1.6;letter-spacing:0}
.an-go{position:static;opacity:.7;align-self:flex-start;margin-top:2px;background:none;border:1px solid var(--bezel);border-radius:5px;
  padding:5px 12px;color:var(--c,var(--d-frequency));font-family:var(--fmono);font-size:10.5px;cursor:pointer;
  transition:opacity var(--t),border-color var(--t)}
.ancard:hover .an-go{opacity:1;border-color:var(--c,var(--d-frequency))}
.an-corr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.an-cchip{font-family:var(--fmono);font-size:9.5px;color:var(--c,var(--d-frequency));border:1px solid color-mix(in srgb,var(--c,var(--d-frequency)) 35%,transparent);
  border-radius:var(--r-ctl);padding:2px 7px;cursor:pointer;background:color-mix(in srgb,var(--c,var(--d-frequency)) 7%,transparent);transition:background var(--t)}
.an-cchip:hover{background:color-mix(in srgb,var(--c,var(--d-frequency)) 16%,transparent)}
.an-rec{margin-top:8px;font-family:var(--fbody);font-size:var(--fs-2);color:var(--txt2);line-height:1.5;letter-spacing:0;
  border-left:2px solid color-mix(in srgb,var(--c,var(--d-frequency)) 50%,transparent);padding-left:9px}
.an-rec b{color:var(--c,var(--d-frequency));font-weight:600;text-transform:uppercase;font-size:9.5px;letter-spacing:.04em;font-family:var(--fmono)}
.an-kb{margin-top:8px;cursor:pointer}
.an-kb-t{font-family:var(--fbody);font-size:var(--fs-1);color:var(--txt3);letter-spacing:0}
.an-kb:hover .an-kb-t{color:var(--txt2)}
.an-kb-d{margin-top:6px;font-family:var(--fbody);font-size:var(--fs-2);color:var(--txt2);line-height:1.55;background:#0B1116;
  border:1px solid var(--seam);border-radius:var(--r);padding:9px 11px;letter-spacing:0}
.hbar{display:flex;align-items:center;gap:8px;margin:3px 0;font-family:var(--fmono);font-size:var(--fs-1)}
.hbar-k{width:22px;color:var(--txt3)}
.hbar-t{flex:1;height:8px;background:#0E151B;border-radius:3px;overflow:hidden}
.hbar-f{display:block;height:100%;background:var(--c,var(--d-frequency))}
.hbar-v{width:42px;text-align:right;color:var(--txt2)}
.sess-tl{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.tl-node{font-family:var(--fmono);font-size:var(--fs-1);color:var(--c,var(--d-frequency));
  border:1px solid color-mix(in srgb,var(--c,var(--d-frequency)) 32%,transparent);border-radius:var(--r-ctl);padding:3px 9px;cursor:pointer;
  background:color-mix(in srgb,var(--c,var(--d-frequency)) 6%,transparent);transition:background var(--t)}
.tl-node:hover{background:color-mix(in srgb,var(--c,var(--d-frequency)) 16%,transparent)}
.tl-arr{color:var(--txt3);font-size:var(--fs-2)}
.concl{font-family:var(--fbody);font-size:var(--fs-3);color:var(--txt);line-height:1.72;background:#0B1116;border:1px solid var(--seam);
  border-left:3px solid var(--d-integrity);border-radius:7px;padding:13px 16px;letter-spacing:0}

/* ── guia flutuante da revisão guiada ─────────────────────────────── */
#guide{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:14px;
  padding:9px 11px 9px 16px;background:linear-gradient(180deg,#10161D,#0B1015);border:1px solid var(--bezel);border-radius:9px;
  box-shadow:inset 0 1px 0 var(--edge),0 20px 48px -20px #000}
#guide .guide-col{display:flex;flex-direction:column;gap:2px}
#guide .guide-lab{font-size:8px;letter-spacing:.15em}
#guide .guide-step{font-family:var(--fbody);font-size:var(--fs-3);color:var(--txt);font-weight:500;max-width:300px}
#guide .guide-step b{font-family:var(--fmono);color:var(--txt3);font-weight:400;margin-right:6px}
#guide .guide-next{font-family:var(--fmono);font-size:var(--fs-2);color:#06101A;background:var(--d-frequency);border:none;border-radius:var(--r);
  padding:8px 13px;cursor:pointer;font-weight:600;white-space:nowrap;transition:filter var(--t)}
#guide .guide-next:hover{filter:brightness(1.1)}
#guide .guide-x{background:none;border:none;color:var(--txt3);font-size:17px;cursor:pointer;line-height:1;padding:2px 4px;transition:color var(--t)}
#guide .guide-x:hover{color:var(--txt)}

#modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(4,7,10,.62)}
#modal.on{display:flex}
.md{width:min(440px,92vw);background:var(--alu);border:1px solid #070C11;border-radius:12px;padding:24px;
  box-shadow:0 30px 80px -40px #000,inset 0 1px 0 var(--edge)}
.md h4{font-family:var(--fident);font-weight:600;font-size:17px;color:var(--txt);margin-bottom:10px}
.md p{font-family:var(--fbody);font-size:13.5px;color:var(--txt2);line-height:1.6}
.md-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}

/* ── palco vazio · console de aquisição · hardware ────────────────── */
.lab-empty{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:13px;padding:40px}
.lab-empty .le-ic{font-size:46px;opacity:.28;color:var(--d-frequency)}
.lab-empty h2{font-family:var(--fident);font-size:22px;font-weight:600;color:var(--txt2);letter-spacing:-.01em}
.lab-empty p{font-family:var(--fbody);font-size:13.5px;color:var(--txt3);line-height:1.65;max-width:430px}

.acq{max-width:780px;margin:44px auto 0;padding:0 24px}
.acq-title{font-family:var(--fident);font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--txt);margin:4px 0 20px}
.acq-console{background:var(--glass);border:1px solid #070C11;border-radius:10px;box-shadow:inset 0 2px 14px rgba(0,0,0,.8);
  padding:18px 20px;min-height:230px;max-height:44vh;overflow:auto;font-family:var(--fmono);font-size:12.5px;line-height:1.95;color:var(--txt2)}
.acq-line{display:flex;gap:10px}
.acq-line .lk{color:var(--ok);flex:none}
.acq-line.run .lk{color:var(--d-frequency)}
.acq-line.run{color:var(--txt)}
.acq-track{height:6px;border-radius:4px;background:var(--glass);box-shadow:inset 0 1px 3px rgba(0,0,0,.75);overflow:hidden;margin-top:16px}
.acq-fill{height:100%;width:0;background:linear-gradient(90deg,#1A63D8,var(--d-frequency));transition:width .35s ease}
.acq-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.acq-pct{font-family:var(--fmono);font-size:var(--fs-2);color:var(--txt3)}

.lab-hw{font-family:var(--fbody);font-size:12.5px;color:var(--txt3);display:flex;align-items:center;gap:10px;margin-bottom:22px;
  padding:10px 14px;border-radius:8px;background:var(--inset);box-shadow:inset 0 1px 3px rgba(0,0,0,.45);max-width:540px;line-height:1.5}
.lab-hw.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--inset))}
.lab-hw-gear{margin-left:auto;background:none;border:none;color:var(--txt2);cursor:pointer;font-size:15px;flex:none;padding:2px 4px;transition:color var(--t)}
.lab-hw-gear:hover{color:var(--txt)}

.hwc{max-width:580px;height:100%;margin:0 auto;padding:44px 24px 0;display:flex;flex-direction:column}
.hwc-head{flex:0 0 auto}
.hwc-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:16px}
.hwc-title{font-family:var(--fident);font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--txt);margin:4px 0 8px}
.hwc-sub{font-family:var(--fbody);font-size:13.5px;color:var(--txt2);line-height:1.6;margin-bottom:20px}
.hwc-actions{flex:0 0 auto;display:flex;justify-content:flex-end;gap:10px;padding:14px 0;border-top:1px solid var(--bezel);
  background:linear-gradient(180deg,transparent,#080B0E 40%)}
.hwc-form{margin:4px 0 18px;padding:16px 18px;background:var(--inset);border:1px solid var(--bezel);border-radius:8px}
.hwc-form .hf-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;min-width:0}
.hwc-form .hf-row>label{font-family:var(--fbody);font-size:12px;color:var(--txt3r);min-width:95px;flex:0 0 95px}
.hwc-form .hf-sel{flex:1 1 auto;min-width:0;max-width:100%;font-family:var(--fmono);font-size:12px;color:var(--txt);
  background:var(--alu);border:1px solid #070C11;border-radius:var(--r);padding:8px 10px;cursor:pointer;text-overflow:ellipsis}
.hwc-form .hf-sel:disabled{color:var(--txt3);cursor:default}
.hwc-form .hf-mode{display:flex;gap:8px}
.hwc-form .hf-mb{font-family:var(--fbody);font-size:12px;color:var(--txt3r);background:var(--alu);border:1px solid #070C11;
  border-radius:var(--r);padding:8px 18px;cursor:pointer;transition:color var(--t),border-color var(--t),background var(--t)}
.hwc-form .hf-mb.on{color:var(--txt);border-color:var(--c,var(--d-frequency));background:#111A22}
.hwc-form .hf-mb:disabled{opacity:.4;cursor:default}
.hwc-form .hf-status{font-family:var(--fmono);font-size:var(--fs-2);color:var(--txt2);margin-top:4px;padding-top:10px;border-top:1px solid #0E141B}
.hwc-caps{margin:4px 0 22px;padding:16px 18px;background:var(--inset);border:1px solid var(--bezel);border-radius:8px}
.hwc-caps .hc-analyzing{color:var(--txt3);font-family:var(--fbody);font-size:var(--fs-3);text-align:center;padding:8px 0}
.hwc-caps .hc-sec{font-family:var(--fbody);font-size:var(--fs-1);letter-spacing:var(--ls-lab);text-transform:uppercase;color:var(--txt3r);margin:10px 0 8px;font-weight:500}
.hwc-caps .hc-sec:first-child{margin-top:0}
.hwc-caps .hc-row{display:flex;align-items:baseline;gap:12px;padding:4px 0;border-bottom:1px solid #0E141B}
.hwc-caps .hc-k{font-family:var(--fbody);font-size:12px;color:var(--txt3r);min-width:130px}
.hwc-caps .hc-v{font-family:var(--fmono);font-size:12px;color:var(--txt2);flex:1}
.hwc-caps .hc-fix{font-family:var(--fbody);font-size:var(--fs-1);color:var(--warn);border:1px solid var(--warn);border-radius:var(--r-ctl);padding:1px 5px;margin-left:6px}
.hwc-caps .hc-note{font-family:var(--fbody);font-size:var(--fs-2);color:var(--txt3);line-height:1.5;margin-top:10px}
.hwc-caps .hc-status{font-family:var(--fbody);font-size:12px;font-weight:600;margin-top:12px}

/* ── barras de rolagem no tema do painel ──────────────────────────── */
*{scrollbar-width:thin;scrollbar-color:#22323D transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1B2831;border-radius:8px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#2A3E4B;background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-corner{background:transparent}

/* ── responsivo · acessibilidade de movimento ─────────────────────── */
@media(max-width:920px){
  #view{grid-template-columns:1fr}
  .ws{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .ws-side{grid-column:1;border-left:none;border-top:1px solid var(--seam)}
  .ws-verdict{grid-column:1}
}
@media(max-width:760px){.mod-q{display:none}.ros{gap:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

    if(dv.getUint32(p,true)!==0x02014b50)throw new Error(T('Diretório central corrompido.'));
    const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),fn=dv.getUint16(p+28,true),ex=dv.getUint16(p+30,true),cm=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+fn));
    if(dv.getUint32(lho,true)!==0x04034b50)throw new Error(T('Cabeçalho local inválido: ')+name);
    const lfn=dv.getUint16(lho+26,true),lex=dv.getUint16(lho+28,true),start=lho+30+lfn+lex;
    if(method!==0)throw new Error('.aamp deve ser STORE; entrada comprimida: '+name);
    files[name]=u8.subarray(start,start+cs);p+=46+fn+ex+cm;
  }
  return files;
}
const asAB=u=>u.buffer.slice(u.byteOffset,u.byteOffset+u.byteLength);
const asText=u=>new TextDecoder().decode(u);

/* ===== WAV ===== */
function parseWAV(buf){
  const dv=new DataView(buf);if(dv.getUint32(0,false)!==0x52494646)throw new Error(T('WAV: não é RIFF'));
  let off=12,fmt=null,dOff=0,dLen=0;
  while(off+8<=dv.byteLength){const id=String.fromCharCode(dv.getUint8(off),dv.getUint8(off+1),dv.getUint8(off+2),dv.getUint8(off+3));const sz=dv.getUint32(off+4,true),b=off+8;
    if(id==='fmt ')fmt={format:dv.getUint16(b,true),channels:dv.getUint16(b+2,true),sampleRate:dv.getUint32(b+4,true),bits:dv.getUint16(b+14,true)};
    else if(id==='data'){dOff=b;dLen=sz;}off=b+sz+(sz&1);}
  if(!fmt||!dOff)throw new Error('WAV: fmt/data ausentes');
  const ch=fmt.channels,by=fmt.bits/8,fr=Math.floor(dLen/(by*ch)),out=new Float32Array(fr);
  for(let i=0;i<fr;i++){const p=dOff+i*by*ch;
    if(fmt.format===3&&fmt.bits===32)out[i]=dv.getFloat32(p,true);
    else if(fmt.format===1&&fmt.bits===16)out[i]=dv.getInt16(p,true)/32768;
    else if(fmt.format===1&&fmt.bits===32)out[i]=dv.getInt32(p,true)/2147483648;
    else if(fmt.format===1&&fmt.bits===24){const a=dv.getUint8(p),x=dv.getUint8(p+1),y=dv.getUint8(p+2);let v=(y<<16)|(x<<8)|a;if(v&0x800000)v-=0x1000000;out[i]=v/8388608;}}
  return {sampleRate:fmt.sampleRate,channels:ch,bits:fmt.bits,format:fmt.format,frames:fr,durationSec:fr/fmt.sampleRate,samples:out};
}
function captureIntegrity(s){let peak=0,sq=0,sum=0,clip=0,sil=0;const n=s.length;
  for(let i=0;i<n;i++){const a=Math.abs(s[i]);if(a>peak)peak=a;sq+=s[i]*s[i];sum+=s[i];if(a>=0.999)clip++;if(a<1e-4)sil++;}
  const rms=Math.sqrt(sq/Math.max(1,n)),db=v=>v>0?20*Math.log10(v):-Infinity;
  return {peak,peakDb:db(peak),rms,rmsDb:db(rms),crest:db(peak)-db(rms),dc:sum/Math.max(1,n),clip,silPct:100*sil/Math.max(1,n)};}

  function dumpPayload(p){if(!on())return;if(!p){log('payload AUSENTE');return;}
    const ms=(p.metrics||[]).map(m=>m.id+' {'+(m.curves||[]).map(c=>c.name+':'+((c.x||[]).length)).join(' | ')+'}');
    log('payload.metrics ('+ms.length+')',ms);

    log('payload.captures',(p.captures||[]).length,cps.length?cps:'[] (VAZIO — origvschar/temporal degradam)');}
  function dumpSession(M){if(!on())return;if(!M){log('session AUSENTE');return;}
    const b=(M.metrics&&M.metrics.byId)||{};
