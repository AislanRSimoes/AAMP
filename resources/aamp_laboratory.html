/* ===== motor espectral compartilhado (visualização descritiva — DSP oficial é do Core) ===== */
function fftRadix2(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){const tr=re[i];re[i]=re[j];re[j]=tr;const ti=im[i];im[i]=im[j];im[j]=ti;}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<len/2;k++){const a=i+k,b=i+k+len/2,vr=re[b]*cr-im[b]*ci,vi=re[b]*ci+im[b]*cr;
      re[b]=re[a]-vr;im[b]=im[a]-vi;re[a]+=vr;im[a]+=vi;const ncr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=ncr;}}}}
function stft(samples,fs,frameSize,hop){const N=frameSize,bins=N>>1,freqs=new Array(bins),frames=[];
  for(let k=0;k<bins;k++)freqs[k]=k*fs/N;const win=new Array(N);for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
  for(let s=0;s+N<=samples.length;s+=hop){const re=new Array(N),im=new Array(N).fill(0);for(let i=0;i<N;i++)re[i]=samples[s+i]*win[i];fftRadix2(re,im);
    const col=new Float32Array(bins);for(let k=0;k<bins;k++)col[k]=20*Math.log10(Math.hypot(re[k],im[k])/N*2+1e-12);frames.push({t:(s+N/2)/fs*1000,col});}
  return {freqs,frames};}
function vizCache(key){const c=M&&(M._vizCache||(M._vizCache={}));return c&&(c[key]||(c[key]={}));}
function cachedStft(key,samples,fs,N,hop,offset){const c=vizCache(key),off=offset||0;if(!c)return stft(off?samples.slice(off):samples,fs,N,hop);
  if(c.samples===samples&&c.fs===fs&&c.N===N&&c.hop===hop&&c.offset===off)return c.res;
  c.samples=samples;c.fs=fs;c.N=N;c.hop=hop;c.offset=off;c.res=stft(off?samples.slice(off):samples,fs,N,hop);return c.res;}
function dbColor(v){v=Math.max(0,Math.min(1,v));const st=[[8,11,16],[20,34,74],[18,96,112],[35,150,96],[150,180,70],[235,225,150],[252,250,224]];
  const sg=v*(st.length-1),i=Math.floor(sg),f=sg-i,a=st[i],b=st[Math.min(i+1,st.length-1)];return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;}
function heatmapChart(host,cfg){const {freqs,frames}=cfg,fmin=cfg.fmin||20,fmax=cfg.fmax||Math.min(freqs[freqs.length-1],20000);
  const ROWS=160,padL=48,padB=26,padT=8,padR=12,binHz=freqs[1]||1;
  const wrap=document.createElement('div');wrap.className='lc';wrap.style.padding='10px 12px';
  const head=document.createElement('div');head.style.cssText='font-family:var(--fmono);font-size:10px;color:var(--txt3);margin-bottom:6px;display:flex;justify-content:space-between;gap:10px';
  head.innerHTML='<span>'+(cfg.title||'')+'</span><span id="hm-read" style="color:var(--c)">—</span>';wrap.appendChild(head);
  const readEl=head.querySelector('#hm-read');
  const cv=document.createElement('canvas');cv.style.cursor='crosshair';wrap.appendChild(cv);host.appendChild(wrap);
  const dpr=window.devicePixelRatio||1,lf0=Math.log10(fmin),lf1=Math.log10(fmax);
  let mx=-Infinity;frames.forEach(fr=>fr.col.forEach(v=>{if(v>mx)mx=v;}));const dbMax=cfg.dbMax!=null?cfg.dbMax:mx,dbMin=dbMax-(cfg.dbSpan||80);
  function draw(){const W=(wrap.clientWidth||700)-24,H=cfg.height||300;cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W*dpr;cv.height=H*dpr;
    const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);const pw=W-padL-padR,ph=H-padT-padB,colW=pw/Math.max(1,frames.length);
    for(let r=0;r<ROWS;r++){const f0=Math.pow(10,lf0+(lf1-lf0)*r/ROWS),f1=Math.pow(10,lf0+(lf1-lf0)*(r+1)/ROWS);
      const k0=Math.max(1,Math.floor(f0/binHz)),k1=Math.min(freqs.length-1,Math.max(k0,Math.ceil(f1/binHz)));
      const yTop=padT+ph*(1-(r+1)/ROWS),rowH=ph/ROWS+1;
      for(let fi=0;fi<frames.length;fi++){let s=0,nn=0;for(let k=k0;k<=k1;k++){s+=frames[fi].col[k];nn++;}const v=nn?s/nn:dbMin;c.fillStyle=dbColor((v-dbMin)/(dbMax-dbMin||1));c.fillRect(padL+fi*colW,yTop,colW+1,rowH);}}
    c.fillStyle=cssv('--txt3');c.font='9px Roboto Mono';c.textAlign='right';
    [20,100,1000,10000].forEach(f=>{if(f<fmin||f>fmax)return;const y=padT+ph*(1-(Math.log10(f)-lf0)/(lf1-lf0));c.fillText(f>=1000?(f/1000)+'k':f,padL-5,y+3);c.strokeStyle='rgba(255,255,255,.05)';c.beginPath();c.moveTo(padL,y);c.lineTo(W-padR,y);c.stroke();});
    c.textAlign='center';const tmax=frames.length?frames[frames.length-1].t:0;[0,.25,.5,.75,1].forEach(fr=>c.fillText(fmt(tmax*fr,0),padL+pw*fr,H-9));
    c.fillStyle=cssv('--txt3');c.textAlign='left';c.fillText((cfg.xUnit||'ms'),W-padR-20,H-9);
    cv._map=(X,Y)=>{if(X<padL||X>W-padR||Y<padT||Y>padT+ph)return null;const fi=Math.min(frames.length-1,Math.max(0,Math.floor((X-padL)/colW)));const f=Math.pow(10,lf0+(lf1-lf0)*(1-(Y-padT)/ph));const k=Math.max(1,Math.min(freqs.length-1,Math.round(f/binHz)));return {t:frames[fi].t,f,db:frames[fi].col[k]};};}
  cv.addEventListener('mousemove',e=>{const R=cv.getBoundingClientRect();const m=cv._map&&cv._map(e.clientX-R.left,e.clientY-R.top);readEl.textContent=m?(fHz(m.f)+' · '+fmt(m.t,0)+(cfg.xUnit||'ms')+' · '+fmt(m.db,1)+' dB'):'—';if(cfg.onHover)cfg.onHover(m);});
  cv.addEventListener('mouseleave',()=>{readEl.textContent='—';if(cfg.onHover)cfg.onHover(null);});
  draw();charts.push({resize:draw});return {draw};}
function hmLegend(){return screen('<div class="side-cap">'+T('Escala')+'</div><div style="height:10px;border-radius:3px;margin:2px 0 6px;background:linear-gradient(90deg,rgb(8,11,16),rgb(20,34,74),rgb(18,96,112),rgb(35,150,96),rgb(150,180,70),rgb(252,250,224))"></div><div style="display:flex;justify-content:space-between;font-family:var(--fmono);font-size:9px;color:var(--txt3)"><span>'+T('baixa energia')+'</span><span>'+T('alta')+'</span></div>');}

function buildSpectrogram(stage){const cap=LAB.getCapture('primary');

function buildWaterfall(stage){const m04=LAB.getById('MS-04'),ir=m04&&m04.curves&&m04.curves.find(c=>/impulse/i.test(c.name));
  if(!(ir&&ir.x&&ir.x.length>2048))return infoEnv(stage,{q:T('Como cada frequência decai ao longo do tempo?'),title:T('Waterfall'),status:T('requer IR'),
    reveals:T('O decaimento espectral cumulativo expõe ressonâncias que persistem no tempo: cristas que demoram a decair revelam modos e ringing invisíveis na resposta em frequência estática. Deriva da resposta impulsiva por STFT.'),
    need:T('Requer MS-04 (resposta impulsiva) com amostras suficientes; o decaimento de energia já é investigável no instrumento Decaimento.')});
  const {answer,main,side}=instWS(stage,T('Como cada frequência decai ao longo do tempo?'),T('Waterfall'));
  const dt=(ir.x[1]-ir.x[0])/1000,fs=dt>0?1/dt:48000,i0=Math.max(0,ir.x.findIndex(v=>v>=0));
  const N=1024,hop=256,res=cachedStft('waterfall',ir.y,fs,N,hop,i0);
  let ringK=1,ringT=0;if(res.frames.length>2){for(let k=2;k<res.freqs.length;k++){let last=0;for(let fi=0;fi<res.frames.length;fi++)if(res.frames[fi].col[k]>res.frames[0].col[k]-20)last=res.frames[fi].t;if(last>ringT){ringT=last;ringK=k;}}}
  answer.innerHTML=vchip(T('JANELA'),N,T('amostras'),'')+vchip(T('QUADROS'),res.frames.length,'','flag')+vchip('RINGING',fHz(res.freqs[ringK]),'','flag')+vchip(T('PERSISTE ATÉ'),fmt(ringT,1),'ms','');
  let curEl=null;
  heatmapChart(main,{title:T('Decaimento espectral cumulativo (CSD) — cristas que persistem revelam ringing/modos'),freqs:res.freqs,frames:res.frames,fmax:Math.min(20000,fs/2),height:Math.max(280,(stage.clientHeight||640)-170),dbSpan:60,
    onHover:mm=>{if(curEl)curEl.innerHTML=hmCur(mm);}});
  side.innerHTML='<div id="wf-cur"></div>'+hmLegend()+screen('<div class="side-cap">'+T('Leitura')+'</div><div class="phen-nat">'+T('A frequência que mais persiste no tempo é')+' <b style="color:var(--c)">'+fHz(res.freqs[ringK])+'</b>'+T(', audível como ringing até ~')+''+fmt(ringT,1)+' '+T('ms. Deriva da STFT da resposta impulsiva.')+'</div>');
  curEl=side.querySelector('#wf-cur');curEl.innerHTML=hmCur(null);}

  side.innerHTML=screen('<div class="side-cap">'+cfg.title+'</div><div class="phen-nat">'+cfg.note+'</div>');
  let chart=null,raf=null,ctx=null,src=null,analyser=null;
  function setState(s){const v=answer.querySelectorAll('.vchip .vc-v')[1];if(v)v.firstChild.textContent=T(s);ctrl.querySelector('#lv-go').disabled=(s==='ativo');ctrl.querySelector('#lv-stop').disabled=(s!=='ativo');}
  function start(){if(ctx)return;try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ctrl.querySelector('#lv-msg').textContent=T('Web Audio indisponível');return;}
    analyser=ctx.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=0.65;
    const bins=analyser.frequencyBinCount,fs=ctx.sampleRate,xs=[];for(let k=1;k<bins;k++)xs.push(k*fs/analyser.fftSize);
    chart=hostChart(host,{name:cfg.id,xScale:'log',xUnit:'Hz',yUnit:'dB',trace:cssv(cfg.mode==='mic'?'--d-noise':'--d-frequency'),height:Math.max(220,(stage.clientHeight||640)-205),series:[{name:'Espectro ao vivo',x:xs,y:xs.map(()=>-110)}]});
    const data=new Float32Array(bins),liveY=data.subarray(1);const loop=()=>{analyser.getFloatFrequencyData(data);chart.updateSeries('Espectro ao vivo',liveY);raf=requestAnimationFrame(loop);};
    const begin=node=>{node.connect(analyser);if(cfg.mode==='playback')analyser.connect(ctx.destination);setState('ativo');loop();};
    if(cfg.mode==='mic'){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ctrl.querySelector('#lv-msg').textContent=T('microfone indisponível neste contexto');stop();return;}
      navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{src=ctx.createMediaStreamSource(stream);src._stream=stream;begin(src);}).catch(e=>{ctrl.querySelector('#lv-msg').textContent=T('microfone negado:')+' '+(e.name||e.message);stop();});}
    else{const cap=M.captures[M.primary];if(!(cap&&cap.wav)){ctrl.querySelector('#lv-msg').textContent=T('sem captura para reproduzir');stop();return;}
      const w=cap.wav;try{const buf=ctx.createBuffer(1,w.samples.length,w.sampleRate||48000);buf.copyToChannel(Float32Array.from(w.samples),0);src=ctx.createBufferSource();src.buffer=buf;src.onended=()=>stop();begin(src);src.start();}catch(e){ctrl.querySelector('#lv-msg').textContent=T('falha na reprodução');stop();}}
    LIVE=stop;}
  function stop(){if(raf)cancelAnimationFrame(raf);raf=null;try{if(src){if(src.stop)try{src.stop();}catch(e){}if(src._stream)src._stream.getTracks().forEach(t=>t.stop());src.disconnect();}}catch(e){}try{if(ctx)ctx.close();}catch(e){}ctx=null;src=null;analyser=null;setState('parado');LIVE=null;}
  ctrl.querySelector('#lv-go').onclick=start;ctrl.querySelector('#lv-stop').onclick=stop;}

/* ===== interpolação compartilhada (usada por TraceMath.diff, intra-Session) ===== */
function interpY(cv,x){const xs=cv.x;if(x<=xs[0])return cv.y[0];if(x>=xs[xs.length-1])return cv.y[xs.length-1];let j=nearestIdx(xs,x);if(xs[j]>x)j--;j=Math.max(0,Math.min(xs.length-2,j));const t=(x-xs[j])/((xs[j+1]-xs[j])||1);return cv.y[j]+(cv.y[j+1]-cv.y[j])*t;}

/* ============================================================
   PLATAFORMA Gen-3 — camadas que todo instrumento consome.
   Os instrumentos NÃO calculam e NÃO acessam estruturas internas:
   apenas pedem à API LAB, que delega aos motores e ao Scientific Engine.
   ============================================================ */
/* Scientific Engine — única casa da matemática compartilhada (sem DOM) */
const SCI={fft:fftRadix2,stft:stft,smooth:smoothFracOct,peaks:detectPeaks,
  freqStats:freqStats,rangeStats:rangeStats,steepest:steepest,bandLevels:bandLevels,etc:etcToDb,
  schroeder:schroeder,crossTime:crossTime,linFit:linFitRange,timeStats:timeStats,nearestIdx:nearestIdx,
  integrity:captureIntegrity};
/* Motores — serviços de investigação, consumidos por todos os instrumentos */
const Investigation={scan:m=>(m===M?sessionAnomalies():scanAnomalies(m)),conclude:(an,t)=>synthesizeConclusion(an,t)};
const Correlation={of:ph=>correlate(ph)};
const Recommendation={forAnomaly:a=>recommend(a)};
const Knowledge={of:t=>kb(t),topicOf:a=>anomalyTopic(a)};
const TraceMath={smooth:(cv,f)=>tmSmooth(cv,f),invert:cv=>tmInvert(cv),normalize:cv=>tmNormalize(cv),diff:(a,b)=>({x:a.x,y:a.x.map((x,i)=>a.y[i]-interpY(b,x))})};
const Derived={state:id=>TM[id]||(TM[id]={})};
const Workflow={steps:an=>workflowSteps(an),current:()=>SESSION.wfStep||0,set:n=>{SESSION.wfStep=n;}};
const SessionSvc={get:()=>SESSION,history:()=>SESSION.history,log:(d,l)=>logHistory(d,l)};

/* LAB — única interface entre instrumentos e plataforma (API interna do Laboratório) */
const LAB={
  session:()=>M,
  trust:()=>M._trust,
  trustLabel:()=>trustLabel(),
  provenance:()=>M.provenance,
  hasAnalysis:()=>!!M.hasAnalysis,
  getCurve:id=>(M.metrics&&M.metrics.curves&&M.metrics.curves[id])||null,
  getById:id=>(M.metrics&&M.metrics.byId&&M.metrics.byId[id])||null,
  getMetric:k=>{const e=M.metrics&&M.metrics.scalars&&M.metrics.scalars[k];return e&&e.value!=null&&isFinite(e.value)?e.value:null;},
  getMetricObj:k=>(M.metrics&&M.metrics.scalars&&M.metrics.scalars[k])||null,
  getCapture:role=>{const C=M.captures||[];if(role==='primary')return C[M.primary];if(role==='sine')return sineCapture();if(role==='silence')return C.find(c=>/silence|st01/i.test(c.file||''));if(role==='ir')return C.find(c=>/ir|impuls/i.test((c.file||'')+(c.stimulus||'')));return null;},
  getCaptures:()=>M.captures||[],
  getAnomalies:()=>sessionAnomalies(),
  getCorrelation:ph=>Correlation.of(ph),
  getRecommendation:a=>Recommendation.forAnomaly(a),
  getKnowledge:t=>Knowledge.of(t),
  getDerived:id=>Derived.state(id),
  getTrace:(op,cv,arg)=>op==='smooth'?TraceMath.smooth(cv,arg):op==='invert'?TraceMath.invert(cv):op==='normalize'?TraceMath.normalize(cv):op==='diff'?TraceMath.diff(cv,arg):null,
  getSession:()=>SessionSvc.get(),
  getWorkflow:()=>Workflow,
  conclusion:()=>Investigation.conclude(sessionAnomalies(),M._trust),
  sci:SCI};

/* =========================================================================
   AAMP — um instrumento, quatro estados: Preparação → Medição → Processamento
   → Laboratório (Investigação, = #view, reuso integral). O frontend só conduz
   o fluxo e representa estados; o Measurement Engine (C++) executa a lógica.
   A ponte é in-process (WebView); abaixo há um transporte SIMULADO que replica
   a sequência do MeasurementOrchestrator, trocável pelo binding nativo sem
   alterar a casca. Filosofia: uma única Session viva; sem histórico/persistência.
   ========================================================================= */
const AAMP=(function(){
  const el=id=>document.getElementById(id);
  const listeners={};
  function on(evt,cb){(listeners[evt]||(listeners[evt]=[])).push(cb);}
  function emit(evt,data){(listeners[evt]||[]).forEach(cb=>{try{cb(data);}catch(e){console.error(e);}});}
  let transport=null;
  function send(cmd,args){if(transport)transport.command(cmd,args||{});}

  /* ---- Transporte nativo (WebView) se o host o expuser; senão, mock ---- */
  function nativeTransport(){
    // JUCE 8 WebBrowserComponent — integração nativa (withNativeIntegrationEnabled)
    if(window.__JUCE__&&window.__JUCE__.backend){
      try{
        window.__JUCE__.backend.addEventListener('aampEvent',pl=>{const d=(typeof pl==='string')?JSON.parse(pl):pl;emit(d.evt,d.data);});
        // Comando JS->C++ pela API documentada do JUCE 8: backend.emitEvent(eventId, payload).
        // (getNativeFunction so existe se o modulo JS index.js do JUCE for carregado; o shim nativo
        //  sozinho nao o expoe — por isso usamos o canal backend, ja disponivel e usado acima.)
        const tr={name:'native-juce',command:(cmd,args)=>window.__JUCE__.backend.emitEvent('aampCommand',JSON.stringify({cmd,args:args||{}}))};
        // Prova de engine no diag_log.txt: o userAgent REAL do motor que executa este JS.
        try{tr.command('diag',{msg:'engine userAgent: '+navigator.userAgent});}catch(e){}
        return tr;
      }catch(e){}
    }
    // Ponte genérica: o host injeta window.aampNative.postMessage e chama window.aampEvent(evt,data)
    if(window.aampNative&&window.aampNative.postMessage){
      window.aampEvent=(evt,data)=>emit(evt,(typeof data==='string')?JSON.parse(data):data);
      return {name:'native',command:(cmd,args)=>window.aampNative.postMessage(JSON.stringify({cmd,args:args||{}}))};
    }
    return null;
  }

  /* ---- MockEngine: replica a sequência do MeasurementOrchestrator ---- */
  function synthPayload(){
    const N=256,x=[],y=[];for(let i=0;i<N;i++){const f=20*Math.pow(1000,i/(N-1));x.push(f);
      const g=9.5*Math.exp(-Math.pow(Math.log(f/2840)/0.28,2));y.push(g-(f>5000?3.2*Math.log(f/5000):0));}
    const cap=[];for(let i=0;i<2048;i++)cap.push((i===40?1:0)+(Math.random()*2-1)*0.02*Math.exp(-i/300));
    return {source:'Measurement Engine (mock)',
      meta:{device:'Loopback Virtual',sampleRate:48000,mode:'Mono',timestamp:new Date().toISOString()},
      metrics:[{id:'MS-01',name:'Resposta em frequência',quality:'Normal',
        scalars:[{key:'passband_lo',value:1020,unit:'Hz',quality:'Normal',valuePresent:true},
                 {key:'passband_hi',value:5370,unit:'Hz',quality:'Normal',valuePresent:true}],
        curves:[{name:'Magnitude',xUnit:'Hz',yUnit:'dB',x,y}]}],
      captures:[{stimulus:'sweep',samples:cap,sampleRate:48000,channels:1}],primary:0};
  }
  const MockEngine=(function(){
    let cancelled=false,timers=[],payload=synthPayload(),mockCfg={};
    const T=(fn,ms)=>{timers.push(setTimeout(fn,ms));};
    const clear=()=>{timers.forEach(clearTimeout);timers=[];};
    /* .aamp canônico em memória (ZIP STORE: manifest.json + analysis.json) — mesmo formato da ponte real. */
    function crc32(u8){let c,t=crc32.T;if(!t){t=crc32.T=new Uint32Array(256);for(let i=0;i<256;i++){c=i;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c>>>0;}}
      c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=t[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
    function makeAampB64(p){const te=new TextEncoder();
      const man=te.encode(JSON.stringify({format:'aamp',version:1,analysis:'analysis.json',
        device:p.meta.device,sampleRate:p.meta.sampleRate,mode:p.meta.mode,timestamp:p.meta.timestamp,capture:[],primaryCapture:''}));
      const ana=te.encode(JSON.stringify(p));
      const parts=[],ents=[];let off=0;
      const w16=v=>[v&255,(v>>8)&255],w32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
      const push=a=>{parts.push(Uint8Array.from(a));off+=a.length;};
      const file=(name,data)=>{const nm=te.encode(name),c=crc32(data);ents.push({nm,c,n:data.length,off});
        push([].concat(w32(0x04034b50),w16(20),w16(0),w16(0),w16(0),w16(0),w32(c),w32(data.length),w32(data.length),w16(nm.length),w16(0)));
        parts.push(nm);off+=nm.length;parts.push(data);off+=data.length;};
      file('manifest.json',man);file('analysis.json',ana);
      const cd=off;

      const mm=[['MS-01','Resposta em frequência'],['MS-04','Resposta ao impulso'],['MS-07','Distorção harmônica'],['MS-11','Ruído & piso']];
      mm.forEach((m,k)=>T(()=>{if(cancelled)return;emit('metricReady',{id:m[0],name:m[1]});emit('progress',{label:T('Calculando métricas oficiais'),percent:76+Math.round((k+1)/mm.length*22)});},t+=step));

    setChannel(){ const ent=el('hwEntrada'),sai=el('hwSaida');

    start(){ const beginAcq=()=>this.beginAcquisition();                   // intenção: iniciar caracterização

  /* Responsibility: enumerar os canais-base válidos de um device, por modo.

  function channelBases(n,stereo){const b=[],c=n|0;
    if(stereo){for(let i=0;i+1<c;i+=2)b.push(i);}else{for(let i=0;i<c;i++)b.push(i);}return b;}

  /* Responsibility: escolher a base válida mais próxima da desejada (SEM tocar DOM).
     Consumes: validBases (array), base (base desejada).
     Produces: base ∈ validBases; se validBases vazio, devolve base INALTERADA (nunca zera).
     Side Effects: None.  Pré: validBases é array.  Pós: len>0 ⇒ resultado ∈ validBases.
     Invariante: validBases não é mutado. */
  function selectClosest(validBases,base){
    if(!validBases.length)return base;
    return validBases.indexOf(base)>=0?base:validBases[0];}

  /* Responsibility: predicado — o desejado já é totalmente válido para as capacidades?
     Consumes: desired {outBase,inBase,mode}, caps {nIn,nOut}.
     Produces: bool.  Side Effects: None.
     Pós: true ⇔ mode consistente E outBase/inBase ∈ bases válidas. */
  function validateAgainstCaps(desired,caps){
    const nIn=caps.nIn|0,nOut=caps.nOut|0,canStereo=(nIn>=2&&nOut>=2);
    if(desired.mode==='Stereo'&&!canStereo)return false;
    const stereo=desired.mode==='Stereo';
    return channelBases(nOut,stereo).indexOf(desired.outBase|0)>=0
        && channelBases(nIn ,stereo).indexOf(desired.inBase|0)>=0;}

  /* Responsibility: corrigir o desejado para um estado válido dado as capacidades.
     Consumes: desired {outBase,inBase,mode}, caps {nIn,nOut}.
     Produces: NOVO objeto {outBase,inBase,mode}.  Side Effects: None (não muta desired).
     Pós: nIn>0 && nOut>0 ⇒ validateAgainstCaps(resultado,caps)===true.
     Invariante: desired de entrada permanece intacto. */
  function adjustToCaps(desired,caps){
    const nIn=caps.nIn|0,nOut=caps.nOut|0,canStereo=(nIn>=2&&nOut>=2);
    const mode=(desired.mode==='Stereo'&&canStereo)?'Stereo':'Mono',stereo=mode==='Stereo';
    return {mode,
      outBase:selectClosest(channelBases(nOut,stereo),desired.outBase|0),
      inBase :selectClosest(channelBases(nIn ,stereo),desired.inBase|0)};}

  /* Responsibility: entrada oficial do ajuste desejado→capacidades (Controller-flow).
     Consumes: desired, caps.  Produces: NOVO desired válido.  Side Effects: None.
     Pós (contrato): nIn>0 && nOut>0 ⇒ validateAgainstCaps(resultado,caps)===true. */
  function clampDesiredToCaps(desired,caps){return adjustToCaps(desired,caps);}
  /* repopulateChannels — RENDER PURO (Sprint 2): reflete o modelo nas ComboBoxes.
     NUNCA muta o modelo (HardwareProfile) nem as Capabilities. O ajuste do modelo é feito ANTES,
     explicitamente, por clampDesiredToCaps no fluxo (Controller-flow). Entrada a partir de nOut;
     Saída a partir de nIn; pares i+=2. */
  function repopulateChannels(){const ent=el('hwEntrada'),sai=el('hwSaida');if(!ent||!sai)return;
    const nIn=DeviceCapabilities.nIn,nOut=DeviceCapabilities.nOut;
    const se=el('hwStereo');if(se)se.disabled=!(nIn>=2&&nOut>=2);   // habilitação do botão (render)
    const stereo=HardwareProfile.mode==='Stereo';                   // LÊ o modelo (HardwareProfile); não muta
    let e='',s='';
    if(stereo){
      for(let i=0;i+1<nOut;i+=2)e+='<option value="'+(i+1)+'">'+(i+1)+'/'+(i+2)+'</option>';
      for(let i=0;i+1<nIn;i+=2) s+='<option value="'+(i+1)+'">'+(i+1)+'/'+(i+2)+'</option>';
    }else{
      for(let i=0;i<nOut;i++)e+='<option value="'+(i+1)+'">'+(i+1)+'</option>';
      for(let i=0;i<nIn;i++) s+='<option value="'+(i+1)+'">'+(i+1)+'</option>';
    }
    ent.innerHTML=e;sai.innerHTML=s;
    selectOption(ent,HardwareProfile.desiredOutBase);               // reflete o modelo (render)
    selectOption(sai,HardwareProfile.desiredInBase);
    updateStatus();}
  /* selectOption — RENDER: seleciona no <select> a opção que reflete a base do modelo.
     NÃO altera o modelo (não retorna base, não escreve HardwareProfile). */
  function selectOption(selEl,base){for(let i=0;i<selEl.options.length;i++){if(+selEl.options[i].value===base+1){selEl.selectedIndex=i;return;}}
    if(selEl.options.length>0)selEl.selectedIndex=0;}
  function updateStatus(){const stt=el('hwStatus');if(!stt||!hwSel)return;
    const stereo=HardwareProfile.mode==='Stereo',ob=HardwareProfile.desiredOutBase,ib=HardwareProfile.desiredInBase;
    const ch=stereo
      ?(t('hwc.in')+' '+(ob+1)+'/'+(ob+2)+'  '+t('hwc.out')+' '+(ib+1)+'/'+(ib+2))
      :(t('hwc.in')+' '+(ob+1)+'  '+t('hwc.out')+' '+(ib+1));
    stt.textContent=hwSel.name+' | '+(stereo?t('hwc.stereo'):t('hwc.mono'))+' | '+ch+' | 48000 Hz';}
  /* Card de capacidades (read-only, DOC-05 §3.2): capacidades do hardware vs. modo operacional AAMP. */
  function renderHwCaps(d){const box=el('hwcCaps');if(!box||!HardwareSession.dialogOpen)return;
    const caps=d.caps||{},op=d.operating||{},v=d.validation||{};
    const list=a=>(a&&a.length)?a.join(' · '):'—';
    const sr=(caps.sampleRates||[]).map(x=>(x/1000)+' kHz');
    const bs=(caps.bufferSizes||[]).map(x=>x+' smp');
    const bd=(caps.bitDepths||[]).map(x=>x+' bit');
    const lat=(v.latencyMs!=null&&v.latencyMs>0)?(v.latencyMs.toFixed(1)+' ms'+(v.latencyPartial?' '+t('hwc.estimated'):'')):'—';
    const ready=d.state==='Ready';
    const stTxt=ready?t('hwc.valid'):t('hwc.invalid');
    const stCol=ready?'var(--ok)':'var(--bad)';
    const row=(k,val)=>'<div class="hc-row"><span class="hc-k">'+k+'</span><span class="hc-v">'+val+'</span></div>';
    box.innerHTML='<div class="hwc-caps">'
      +'<div class="hc-sec">'+t('hwc.caps')+'</div>'
      +row(t('hwc.backend'),caps.backend||d.backend||'—')
      +row(t('hwc.channels'),(caps.inputChannels||0)+' '+t('hwc.in')+' · '+(caps.outputChannels||0)+' '+t('hwc.out'))
      +row('Sample rates',list(sr))
      +row('Buffer sizes',list(bs))
      +(bd.length?row('Bit depths',list(bd)):'')
      +(caps.manufacturer?row(t('hwc.manufacturer'),caps.manufacturer):'')
      +row(t('hwc.latency'),lat)
      +'<div class="hc-sec">'+t('hwc.op')+'</div>'
      +row('Sample rate',((op.sampleRate||48000)/1000)+' kHz <span class="hc-fix">'+t('hwc.fixed')+'</span>')
      +'<div class="hc-note">'+t('hwc.note')+'</div>'
      +'<div class="hc-status" style="color:'+stCol+'">'+stTxt+'</div>'
      +'</div>';}

  /* Console de aquisição — renderizado no próprio palco (sem modal, sem troca de tela) */
  function acqLog(text,run){const box=el('acqLog');if(!box)return;const prev=acqRunLine&&acqRunLine.isConnected?acqRunLine:box.querySelector('.acq-line.run');if(prev){prev.classList.remove('run');const k=prev.querySelector('.lk');if(k)k.textContent='✓';}
    const line=document.createElement('div');line.className='acq-line'+(run?' run':'');line.innerHTML='<span class="lk">'+(run?'▸':'✓')+'</span><span>'+text+'</span>';box.appendChild(line);box.scrollTop=box.scrollHeight;acqRunLine=run?line:null;}
  function acqBar(p){if(p==null)return;acqPct=p;acqBarPending=p;if(acqBarRAF)return;acqBarRAF=requestAnimationFrame(()=>{acqBarRAF=0;const v=acqBarPending;const f=el('acqFill'),x=el('acqPct');if(f)f.style.width=v+'%';if(x)x.textContent=v+'%';});}
  /* Relógio do operador: nunca deixar o usuário sem saber o que está acontecendo (etapa · tempo · ETA). */
  function acqClock(){const c=el('acqClock');if(!c)return;const ms=Date.now()-acqT0;
    let s=t('acq.step',{n:acqStep})+' · '+t('acq.elapsed',{t:fmtClock(ms)});
    if(acqPct>3&&acqPct<100)s+=' · '+t('acq.eta',{t:fmtClock(ms*(100-acqPct)/acqPct)});
    c.textContent=s;}
  function acqAdvance(text,run){acqStep++;acqLog(text,run);acqClock();}
  // renderAcqConsole — VIEW: monta o console de aquisição no palco e zera o relógio. NÃO transiciona a FSM
  // nem decide prepare (isso é do HardwareController.beginAcquisition). O botão Cancelar apenas pede ao backend.
  function renderAcqConsole(){exported=false;acqRunLine=null;acqBuildLogged=false;acqState='';acqBarPending=null;if(acqBarRAF){cancelAnimationFrame(acqBarRAF);acqBarRAF=0;}
    acqT0=Date.now();acqPct=0;acqStep=0;clearInterval(acqTimer);acqTimer=setInterval(acqClock,1000);
    const st=el('stage');st.className='';
    st.innerHTML='<div class="acq"><div class="acq-eyebrow">'+t('acq.eyebrow')+'</div><div class="acq-title">'+t('acq.title')+'</div>'
      +'<div class="acq-console" id="acqLog"></div><div class="acq-track"><div class="acq-fill" id="acqFill"></div></div>'
      +'<div class="acq-foot"><button class="btn" id="acqCancel">'+t('acq.cancel')+'</button><span class="acq-pct" id="acqClock"></span><span class="acq-pct" id="acqPct">0%</span></div></div>';
    el('acqCancel').onclick=()=>send('cancel');}
  function stopAcqClock(){clearInterval(acqTimer);acqTimer=0;}

  /* ---- Fiação dos eventos da ponte (mesmos para mock e binding nativo) ---- */
  // P2-01: adaptadores finos — cada evento de backend é uma intenção interpretada pelo HardwareController.
  on('devices',d=>HardwareController.onDevices(d));       // enumerate/validação do Desired persistido
  on('prepared',d=>HardwareController.onPrepared(d));     // prepare() concluído: caps + estado + validação
  on('state',d=>HardwareController.onDeviceState(d));     // estado do backend durante a aquisição
  on('progress',d=>{if(!HardwareSession.acquiring)return;if(d.percent!=null)acqBar(d.percent);
    // Etapa legível durante a captura: "Capturando estímulos (c/t)…" atualizada in-loco na linha ativa.
    if(d.completed!=null&&d.total>0&&acqRunLine){const s=acqRunLine.querySelector('span:last-child');
      if(s)s.textContent=t('acq.capturing',{c:Math.min(d.completed+1,d.total),t:d.total});}
    acqClock();
    if(d.percent!=null&&d.percent>=100&&!acqBuildLogged){acqBuildLogged=true;acqAdvance(t('acq.session'),true);}});
  // Cada métrica oficial concluída entra no console com nome compreensível + identificador técnico.
  on('metricReady',d=>{if(!HardwareSession.acquiring||!d||!d.id)return;acqLog(t('acq.metric',{name:msName(d.id,d.name),id:d.id}),false);});
  on('exported',()=>{exported=true;});
  on('runFinished',d=>HardwareController.onRunFinished(d));   // fim da aquisição: FSM → Idle + ingest do .aamp

  /* ---- Ações de produto (grupo Caracterização) ---- */
  // API pública / gatilho de UI: delega a intenção "iniciar caracterização" ao HardwareController (P2-01).
  function newCharacterization(){HardwareController.start();}
  function importCharacterization(){const fi=document.getElementById('fi');
    if(M)showModal({title:t('modal.import.title'),body:t('modal.import.body'),
      actions:[{label:t('btn.cancel')},{label:t('btn.continue'),kind:'primary',onClick:()=>{teardown();renderEmpty();fi.value='';fi.click();}}]});
    else{fi.value='';fi.click();}
  }
  function requestClose(done){
    if(M&&!exported)showModal({title:t('modal.close.title'),body:t('modal.close.body'),
      actions:[{label:t('btn.cancel')},{label:t('btn.discard'),onClick:()=>done&&done('discard')},
               {label:t('btn.export'),kind:'primary',onClick:()=>{on('exported',()=>done&&done('exported'));send('export',{format:'pdf'});}}]});
    else done&&done('none');
  }
  function showModal(o){const m=el('md');m.innerHTML='<h4>'+o.title+'</h4><p>'+o.body+'</p><div class="md-actions"></div>';
    const a=m.querySelector('.md-actions');(o.actions||[]).forEach(ac=>{const btn=document.createElement('button');btn.className='btn'+(ac.kind==='primary'?' btn-primary':'');btn.textContent=ac.label;btn.onclick=()=>{el('modal').classList.remove('on');if(ac.onClick)ac.onClick();};a.appendChild(btn);});
    el('modal').classList.add('on');}

  /* ---- Persistência (ponte): idioma + última configuração de hardware ----
     Boot: getSettings + enumerate ANTES de qualquer painel — quando o usuário abrir a
     configuração, listas e seleção já estão prontas (zero espera, mínimo de cliques). */
  // P2-01: settings (idioma + Desired persistido) → intenção interpretada pelo HardwareController.
  // A validação do Desired contra a lista REAL de devices foi consolidada em HardwareController.onDevices.
  on('settings',d=>HardwareController.onSettings(d));
  function persistHardware(){if(HardwareProfile.has())send('saveSettings',{hardware:HardwareProfile.toPersist()});}
  function setLanguage(l){if(!I18N[l]||l===LANG)return;LANG=l;
    try{localStorage.setItem('aamp.lang',l);}catch(e){}
    send('setLanguage',{lang:l});applyLanguage();}
  /* Troca dinâmica: reconstrói casca + estado visível; painéis transitórios atualizam na próxima abertura. */
  function applyLanguage(){syncLangKeys();
    try{SESSION._anomalies=null;}catch(e){}          // rótulos de anomalia são gerados no idioma ativo
    buildRail();
    if(!HardwareSession.dialogOpen&&!HardwareSession.acquiring){if(M&&CURRENT)showDomain(CURRENT);else if(!M)renderEmpty();}
    renderGuide&&renderGuide();}
  function syncLangKeys(){const p=el('lang-pt'),e=el('lang-en');
    if(p)p.classList.toggle('on',LANG==='pt-BR');if(e)e.classList.toggle('on',LANG==='en');
    const rt=document.getElementById('rail-toggle');if(rt)rt.title=T('recolher / expandir menu');}

  /* ---- Boot: entra direto no Laboratório, sem Session (só Caracterização ativa) ---- */
  function initShell(){el('view').classList.remove('hide');
    const p=el('lang-pt'),e=el('lang-en');
    if(p)p.onclick=()=>setLanguage('pt-BR');if(e)e.onclick=()=>setLanguage('en');
    syncLangKeys();buildRail();renderEmpty();
    send('getSettings');send('enumerate');   // aquecimento: listas prontas antes do primeiro clique
  }

  return {bridge:{on,emit,send,get mode(){return transport&&transport.name;}},mock:MockEngine,
    newCharacterization,importCharacterization,openHardwareConfig,requestClose,initShell,showModal,setLanguage,
    isExported:()=>exported,hasSession:()=>!!M,isAcquiring:()=>HardwareSession.acquiring,hardware:()=>HardwareProfile.has()?HardwareProfile.toPersist():null,fsmState:()=>HardwareSession.state};
})();

window.addEventListener('beforeunload',e=>{if(AAMP.hasSession()&&!AAMP.isExported()){e.preventDefault();e.returnValue='';}});
/* Host nativo pediu para fechar (botão da janela): o produto decide (exportar/descartar) e confirma. */
AAMP.bridge.on('closeRequested',()=>{AAMP.requestClose(()=>AAMP.bridge.send('closeConfirm',{}));});
AAMP.initShell();
</script>
